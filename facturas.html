<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Módulo de Facturación · Clima Hogar</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root { 
      --bg-gradient: linear-gradient(135deg, #0284c7 0%, #0369a1 50%, #0f172a 100%);
      --surface: rgba(15, 23, 42, 0.85);
      --surface-2: rgba(30, 41, 59, 0.7);
      --line: rgba(255, 255, 255, 0.12);
      --ink: #f8fafc;
      --ink-2: #94a3b8;
      --accent: #38bdf8;
      --accent-ink: #0f172a;
      --good: #10b981;
      --bad: #ef4444;
    }
    body { 
      margin: 0; 
      background: var(--bg-gradient); 
      background-attachment: fixed;
      color: var(--ink); 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      padding: 16px; 
      box-sizing: border-box;
    }
    .container { max-width: 800px; margin: 0 auto; padding-bottom: 40px; }
    
    .header-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .header-title { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; margin: 0 0 4px; color: #fff; text-transform: uppercase; letter-spacing: 0.5px; }
    .header-subtitle { font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 16px; }

    .actions-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .btn { 
      padding: 12px 14px; 
      border-radius: 12px; 
      font-weight: 700; 
      font-size: 12px; 
      text-transform: uppercase; 
      cursor: pointer; 
      border: 1px solid var(--line); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 6px; 
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn-secondary { background: var(--surface-2); color: var(--ink); }
    .btn-danger { background: rgba(239, 68, 68, 0.2); color: #f87171; border-color: rgba(239, 68, 68, 0.4); }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .card h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; color: #fff; margin-top: 0; margin-bottom: 16px; text-transform: uppercase; border-bottom: 1px solid var(--line); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 11px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
    input, select, textarea { 
      width: 100%; 
      padding: 12px; 
      background: var(--surface-2); 
      border: 1px solid var(--line); 
      border-radius: 10px; 
      color: #fff; 
      font-size: 14px; 
      box-sizing: border-box; 
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }

    .concept-edit-row { display: grid; grid-template-columns: 55px 1fr 85px 40px; gap: 6px; margin-bottom: 10px; align-items: center; }
    
    /* Estilos formales de Documento Carta con Logotipo corporativo */
    .preview-box { background: #fff; color: #000; border-radius: 12px; padding: 36px; margin-top: 20px; font-family: 'Plus Jakarta Sans', sans-serif; box-sizing: border-box; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .preview-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #0284c7; padding-bottom: 16px; margin-bottom: 20px; gap: 20px; }
    .preview-logo-img { width: 65px; height: 65px; object-fit: contain; flex-shrink: 0; }
    .preview-title { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; color: #0284c7; font-weight: 700; text-transform: uppercase; line-height: 1.1; }
    
    .preview-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
    .preview-table th, .preview-table td { padding: 10px; border-bottom: 1px solid #cbd5e1; text-align: left; color: #000; }
    .preview-table th { background: #f1f5f9; color: #0f172a; font-weight: 700; text-transform: uppercase; font-size: 11px; border-top: 1px solid #cbd5e1; }
    
    .preview-totals { margin-top: 24px; text-align: right; font-size: 14px; line-height: 1.6; }

    @media print {
      body { background: #fff; color: #000; padding: 0; }
      .card:not(#preview-card), .header-card { display: none !important; }
      .container { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
      .card#preview-card { background: #fff !important; border: none !important; box-shadow: none !important; padding: 0 !important; margin: 0 !important; }
      .preview-box { background: #fff !important; color: #000 !important; padding: 0 !important; margin: 0 !important; border-radius: 0 !important; box-shadow: none !important; }
    }
  </style>
</head>
<body>

<div class="container">
  
  <div class="header-card">
    <div class="header-title">Clima Hogar Multi Servicios</div>
    <div class="header-subtitle">Módulo de Facturación y Comprobantes</div>

    <div class="actions-grid">
      <button class="btn btn-secondary" onclick="window.location.href='index.html'">Volver al Sistema</button>
      <button class="btn btn-primary" onclick="window.print()">Imprimir / Guardar PDF</button>
    </div>
  </div>

  <div class="card">
    <h2>1. Datos de la Factura</h2>
    
    <div class="form-group">
      <label>Folio</label>
      <input type="text" id="fac-folio" value="CH-2026-089" oninput="actualizarPreview()">
    </div>

    <div class="form-group">
      <label>Fecha</label>
      <input type="text" id="fac-fecha" value="10/11/2026" oninput="actualizarPreview()">
    </div>

    <div class="form-group">
      <label>Cliente</label>
      <input type="text" id="fac-cliente" value="CETis 116 Antonia Nava de Catalán" oninput="actualizarPreview()">
    </div>

    <div class="form-group">
      <label>Ubicación / Ciudad</label>
      <input type="text" id="fac-ubicacion" value="Acapulco, Guerrero" oninput="actualizarPreview()">
    </div>

    <div class="form-group">
      <label>Método de Pago</label>
      <select id="fac-metodo" onchange="actualizarPreview()">
        <option value="Transferencia / Efectivo" selected>Transferencia / Efectivo</option>
        <option value="Transferencia Bancaria">Transferencia Bancaria</option>
        <option value="Efectivo">Efectivo</option>
      </select>
    </div>

    <div class="form-group">
      <label>Aplicar I.V.A. (16%)</label>
      <select id="fac-iva" onchange="actualizarPreview()">
        <option value="si" selected>Sí (16% IVA)</option>
        <option value="no">No (Sin IVA)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Resumen Técnico General</label>
      <textarea id="fac-resumen" rows="3" oninput="actualizarPreview()">Reparación de tubería condensadora, instalación, limpieza profunda biblioteca y áreas administrativas, y carga de gas refrigerante.</textarea>
    </div>
  </div>

  <div class="card">
    <h2>
      2. Conceptos y Costos
      <button type="button" class="btn btn-primary" style="padding: 6px 12px; font-size: 11px;" onclick="agregarConcepto()">+ Añadir</button>
    </h2>
    <div id="conceptos-editor"></div>
  </div>

  <!-- VISTA PREVIA EN VIVO -->
  <div class="card" id="preview-card">
    <h2>3. Vista Previa del Documento</h2>
    <div class="preview-box" id="preview-content">
      <!-- Se genera en tiempo real -->
    </div>
  </div>

</div>

<script>
  var conceptos = [
    { cant: 1, desc: "Reparación de tubería condensadora", precio: 1500 },
    { cant: 1, desc: "Instalación de aire acondicionado - Ubicación: Aula 19", precio: 2000 },
    { cant: 4, desc: "Limpieza profunda de aires acondicionados - Ubicación: Biblioteca Escolar", precio: 6000 },
    { cant: 3, desc: "Limpieza de aires acondicionados - Ubicación: Áreas de Planeación, Titulación y Financieros", precio: 4500 }
  ];

  function renderizarEditor() {
    var container = document.getElementById('conceptos-editor');
    var html = '';
    conceptos.forEach(function(item, index) {
      html += '<div class="concept-edit-row">' +
                '<input type="number" value="' + item.cant + '" onchange="actualizarItem(' + index + ', \'cant\', this.value)" placeholder="Cant">' +
                '<input type="text" value="' + item.desc + '" onchange="actualizarItem(' + index + ', \'desc\', this.value)" placeholder="Descripción">' +
                '<input type="number" value="' + item.precio + '" onchange="actualizarItem(' + index + ', \'precio\', this.value)" placeholder="Precio $">' +
                '<button type="button" class="btn btn-danger" style="padding: 8px; height: 100%;" onclick="eliminarItem(' + index + ')">✕</button>' +
              '</div>';
    });
    container.innerHTML = html;
    actualizarPreview();
  }

  window.agregarConcepto = function() {
    conceptos.push({ cant: 1, desc: "Nuevo concepto de servicio", precio: 1000 });
    renderizarEditor();
  };

  window.eliminarItem = function(index) {
    conceptos.splice(index, 1);
    renderizarEditor();
  };

  window.actualizarItem = function(index, campo, valor) {
    if (campo === 'cant' || campo === 'precio') {
      conceptos[index][campo] = parseFloat(valor) || 0;
    } else {
      conceptos[index][campo] = valor;
    }
    actualizarPreview();
  };

  window.actualizarPreview = function() {
    var folio = document.getElementById('fac-folio').value;
    var fecha = document.getElementById('fac-fecha').value;
    var cliente = document.getElementById('fac-cliente').value;
    var ubicacion = document.getElementById('fac-ubicacion').value;
    var metodo = document.getElementById('fac-metodo').value;
    var aplicaIva = document.getElementById('fac-iva').value === 'si';
    var resumen = document.getElementById('fac-resumen').value;

    var subtotal = 0;
    var filasHtml = '';
    conceptos.forEach(function(c) {
      var totalFila = c.cant * c.precio;
      subtotal += totalFila;
      filasHtml += '<tr>' +
                     '<td style="width: 10%; text-align: center;"><b>' + c.cant + '</b></td>' +
                     '<td style="width: 50%;">' + c.desc + '</td>' +
                     '<td style="width: 20%;">$' + c.precio.toLocaleString('es-MX', {minimumFractionDigits: 2}) + '</td>' +
                     '<td style="width: 20%;"><b>$' + totalFila.toLocaleString('es-MX', {minimumFractionDigits: 2}) + '</b></td>' +
                   '</tr>';
    });

    var iva = aplicaIva ? subtotal * 0.16 : 0;
    var totalGeneral = subtotal + iva;

    var previewHtml = 
      '<div class="preview-header">' +
        '<div style="display: flex; align-items: center; gap: 14px;">' +
          '<img src="logo-climahogar.png" alt="Logo Clima Hogar" class="preview-logo-img" onerror="this.style.display=\'none\'">' +
          '<div>' +
            '<div class="preview-title">Clima Hogar Multi Servicios</div>' +
            '<div style="font-size:12px; color:#475569; font-weight:600;">JFAM Tecno-Energy · CETis 116 (Acapulco, Gro.)</div>' +
          '</div>' +
        '</div>' +
        '<div style="text-align:right; font-size:12px; line-height:1.4;">' +
          '<b>Folio:</b> ' + folio + '<br>' +
          '<b>Fecha:</b> ' + fecha +
        '</div>' +
      '</div>' +
      '<div style="font-size:13px; margin-bottom:16px; line-height:1.5; color:#0f172a;">' +
        '<b>Cliente:</b> ' + cliente + '<br>' +
        '<b>Ubicación:</b> ' + ubicacion + '<br>' +
        '<b>Método de Pago:</b> ' + metodo +
      '</div>' +
      '<div style="font-size:12px; margin-bottom:16px; background:#f8fafc; padding:12px; border-radius:6px; border-left:4px solid #0284c7; color:#334155; line-height:1.4;">' +
        '<b>Resumen Técnico General:</b> ' + resumen +
      '</div>' +
      '<table class="preview-table">' +
        '<thead>' +
          '<tr>' +
            '<th style="width: 10%; text-align: center;">Cant</th>' +
            '<th style="width: 50%;">Descripción</th>' +
            '<th style="width: 20%;">P. Unit</th>' +
            '<th style="width: 20%;">Importe</th>' +
          '</tr>' +
        '</thead>' +
        '<tbody>' + filasHtml + '</tbody>' +
      '</table>' +
      '<div class="preview-totals">' +
        'Subtotal: $' + subtotal.toLocaleString('es-MX', {minimumFractionDigits: 2}) + '<br>' +
        (aplicaIva ? 'I.V.A. (16%): $' + iva.toLocaleString('es-MX', {minimumFractionDigits: 2}) + '<br>' : '') +
        '<b style="font-size:17px; color:#0284c7;">Total: $' + totalGeneral.toLocaleString('es-MX', {minimumFractionDigits: 2}) + '</b>' +
      '</div>';

    document.getElementById('preview-content').innerHTML = previewHtml;
  };

  renderizarEditor();
</script>

</body>
</html>
