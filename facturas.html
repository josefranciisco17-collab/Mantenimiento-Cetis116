<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Módulo de Facturación · Clima Hogar</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root { 
      --bg-gradient: linear-gradient(135deg, #0284c7 0%, #0369a1 50%, #0f172a 100%);
      --surface: rgba(15, 23, 42, 0.85);
      --surface-2: rgba(30, 41, 59, 0.7);
      --line: rgba(255, 255, 255, 0.12);
      --ink: #f8fafc;
      --ink-2: #94a3b8;
      --accent: #38bdf8;
      --accent-ink: #0f172a;
      --good: #10b981;
      --bad: #ef4444;
    }
    body { 
      margin: 0; 
      background: var(--bg-gradient); 
      background-attachment: fixed;
      color: var(--ink); 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      padding: 16px; 
      box-sizing: border-box;
    }
    .container { max-width: 800px; margin: 0 auto; padding-bottom: 40px; }
    
    .header-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .header-title { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; margin: 0 0 4px; color: #fff; text-transform: uppercase; letter-spacing: 0.5px; }
    .header-subtitle { font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 16px; }

    .actions-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .btn { 
      padding: 12px 14px; 
      border-radius: 12px; 
      font-weight: 700; 
      font-size: 12px; 
      text-transform: uppercase; 
      cursor: pointer; 
      border: 1px solid var(--line); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 6px; 
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn-secondary { background: var(--surface-2); color: var(--ink); }
    .btn-danger { background: rgba(239, 68, 68, 0.2); color: #f87171; border-color: rgba(239, 68, 68, 0.4); }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .card h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; color: #fff; margin-top: 0; margin-bottom: 16px; text-transform: uppercase; border-bottom: 1px solid var(--line); padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 11px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
    input, select, textarea { 
      width: 100%; 
      padding: 12px; 
      background: var(--surface-2); 
      border: 1px solid var(--line); 
      border-radius: 10px; 
      color: #fff; 
      font-size: 14px; 
      box-sizing: border-box; 
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }

    /* Estilos para la tabla editable de conceptos */
    .concept-row { display: grid; grid-template-columns: 70px 1fr 40px; gap: 8px; margin-bottom: 10px; align-items: center; }
    @media print {
      body { background: #fff; color: #000; padding: 0; }
      .card, .header-card { background: #fff; border: 1px solid #ccc; box-shadow: none; color: #000; }
      input, select, textarea { background: #fff; color: #000; border: 1px solid #ccc; }
      .actions-grid, button { display: none !important; }
    }
  </style>
</head>
<body>

<div class="container">
  
  <div class="header-card">
    <div class="header-title">Clima Hogar Multi Servicios</div>
    <div class="header-subtitle">Módulo de Facturación y Comprobantes</div>

    <div class="actions-grid">
      <button class="btn btn-secondary" onclick="window.location.href='index.html'">Volver al Sistema</button>
      <button class="btn btn-primary" onclick="window.print()">Descargar Factura PDF</button>
    </div>
  </div>

  <div class="card">
    <h2>1. Datos de la Factura</h2>
    
    <div class="form-group">
      <label>Folio</label>
      <input type="text" id="fac-folio" value="CH-2026-089">
    </div>

    <div class="form-group">
      <label>Fecha</label>
      <input type="text" id="fac-fecha" value="10/11/2026">
    </div>

    <div class="form-group">
      <label>Cliente</label>
      <input type="text" id="fac-cliente" value="CETis 116 Antonia Nava de Catalán">
    </div>

    <div class="form-group">
      <label>Ubicación / Ciudad</label>
      <input type="text" id="fac-ubicacion" value="Acapulco, Guerrero">
    </div>

    <div class="form-group">
      <label>Método de Pago</label>
      <select id="fac-metodo">
        <option value="Transferencia / Efectivo" selected>Transferencia / Efectivo</option>
        <option value="Transferencia Bancaria">Transferencia Bancaria</option>
        <option value="Efectivo">Efectivo</option>
        <option value="Cheque / Orden de Pago">Cheque / Orden de Pago</option>
      </select>
    </div>

    <div class="form-group">
      <label>Aplicar I.V.A. (16%)</label>
      <select id="fac-iva">
        <option value="si" selected>Sí (16% IVA)</option>
        <option value="no">No (Sin IVA)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Resumen Técnico General</label>
      <textarea id="fac-resumen" rows="3">Reparación de tubería condensadora, instalación, limpieza profunda biblioteca y áreas administrativas, y carga de gas refrigerante.</textarea>
    </div>
  </div>

  <div class="card">
    <h2>
      2. Conceptos
      <button type="button" class="btn btn-primary" style="padding: 6px 12px; font-size: 11px;" onclick="agregarConcepto()">+ Añadir Concepto</button>
    </h2>
    
    <div id="conceptos-container">
      <!-- Los conceptos se cargan dinámicamente aquí -->
    </div>
  </div>

</div>

<script>
  var conceptosIniciales = [
    { cant: 1, desc: "Reparación de tubería condensadora" },
    { cant: 1, desc: "Instalación de aire acondicionado - Ubicación: Aula 19" },
    { cant: 4, desc: "Limpieza profunda de aires acondicionados - Ubicación: Biblioteca Escolar" },
    { cant: 3, desc: "Limpieza de aires acondicionados - Ubicación: Áreas de Planeación, Titulación y Financieros" }
  ];

  function renderizarConceptos() {
    var container = document.getElementById('conceptos-container');
    var html = '';
    conceptosIniciales.forEach(function(item, index) {
      html += '<div class="concept-row">' +
                '<input type="number" value="' + item.cant + '" onchange="actualizarConcepto(' + index + ', \'cant\', this.value)" placeholder="Cant">' +
                '<input type="text" value="' + item.desc + '" onchange="actualizarConcepto(' + index + ', \'desc\', this.value)" placeholder="Descripción">' +
                '<button type="button" class="btn btn-danger" style="padding: 10px; height: 100%;" onclick="eliminarConcepto(' + index + ')">✕</button>' +
              '</div>';
    });
    container.innerHTML = html;
  }

  window.agregarConcepto = function() {
    conceptosIniciales.push({ cant: 1, desc: "Nuevo concepto de servicio" });
    renderizarConceptos();
  };

  window.eliminarConcepto = function(index) {
    conceptosIniciales.splice(index, 1);
    renderizarConceptos();
  };

  window.actualizarConcepto = function(index, campo, valor) {
    conceptosIniciales[index][campo] = valor;
  };

  // Inicializar al cargar
  renderizarConceptos();
</script>

</body>
</html>
