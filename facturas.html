<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Generador de Facturas · Clima Hogar Multi Servicios</title>
​<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<!-- html2pdf para la exportación a PDF exacta -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
​<style>
:root {
--bg: #0B131A;
--surface: #131E26;
--surface-2: #1B2934;
--surface-3: #223442;
--ink: #E6EEF1;
--ink-2: #92A6B2;
--line: #2A3F4E;
--accent: #06B6D4;
--accent-ink: #041E26;
--accent-soft: rgba(6, 182, 212, 0.15);
--ok: #10B981;
--bad: #EF4444;
--font-display: 'Barlow Condensed', sans-serif;
--font-body: 'Plus Jakarta Sans', sans-serif;
--font-mono: 'JetBrains Mono', monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.inner { max-width: 1200px; margin: 0 auto; padding: 20px; }
​/* Header */
.top { background: linear-gradient(180deg, #101B22 0%, var(--bg) 100%); border-bottom: 1px solid var(--line); padding: 20px 0; }
.top .inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand h1 { font: 700 26px var(--font-display); text-transform: uppercase; color: #fff; }
.brand p { color: var(--accent); font-size: 12px; font-weight: 600; text-transform: uppercase; }
.top-actions { display: flex; gap: 10px; }
​.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 16px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); font-weight: 600; font-size: 14px; transition: all .2s; }
.btn:hover { border-color: var(--accent); background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.small { min-height: 32px; padding: 4px 12px; font-size: 12px; }
.btn.danger { color: var(--bad); border-color: rgba(239,68,68,0.3); background: transparent; }
​/* Layout principal */
.layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 20px; }
@media(max-width: 900px) { .layout { grid-template-columns: 1fr; } }
​.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,.3); }
.panel h2 { font: 700 20px var(--font-display); text-transform: uppercase; color: #fff; margin-bottom: 16px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
​.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.fld { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.fld label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--ink-2); letter-spacing: .05em; }
.fld input, .fld select, .fld textarea { width: 100%; min-height: 40px; padding: 8px 12px; background: var(--bg); border: 1.5px solid var(--line); border-radius: 6px; color: var(--ink); font-size: 14px; }
.fld textarea { min-height: 70px; resize: vertical; }
.fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--accent); outline: none; }
​/* Tabla de conceptos en edición */
.items-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
.items-table th { background: var(--surface-2); color: var(--ink-2); padding: 8px; text-align: left; font-size: 11px; text-transform: uppercase; }
.items-table td { padding: 8px; border-bottom: 1px solid var(--line); }
.items-table input { min-height: 32px; padding: 4px 8px; font-size: 13px; }
​/* Previsualización Estilo Factura PDF (Acrobat / Impresión) */
.preview-container { background: #fff; color: #111; padding: 24px; border-radius: 8px; font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-size: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.inv-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #06B6D4; padding-bottom: 12px; margin-bottom: 12px; }
.inv-logo-area { display: flex; align-items: center; gap: 12px; }
.inv-logo-box { width: 50px; height: 50px; background: #06B6D4; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-size: 20px; font-family: var(--font-display); }
.inv-company h3 { font: 700 18px 'Barlow Condensed', sans-serif; text-transform: uppercase; color: #041E26; }
.inv-company p { font-size: 10px; color: #555; line-height: 1.3; }
.inv-folio-box { text-align: right; }
.inv-folio-box h2 { font: 700 20px 'Barlow Condensed', sans-serif; color: #06B6D4; text-transform: uppercase; }
.inv-folio-box p { font-size: 11px; color: #444; }
​.inv-client-box { display: flex; justify-content: space-between; background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 6px; margin-bottom: 12px; }
.inv-summary-bar { background: #e0f2fe; color: #0369a1; padding: 8px 10px; font-size: 11px; border-radius: 4px; margin-bottom: 12px; font-weight: 500; }
​.pdf-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
.pdf-table th { background: #041E26; color: #fff; padding: 6px 8px; font-size: 10px; text-transform: uppercase; text-align: left; }
.pdf-table td { padding: 6px 8px; border-bottom: 1px solid #e2e8f0; font-size: 11px; color: #333; }
.pdf-table td.num, .pdf-table th.num { text-align: right; }
​.inv-totals { display: flex; justify-content: flex-end; margin-top: 10px; }
.inv-totals-box { width: 220px; display: grid; gap: 4px; font-size: 11px; }
.inv-total-row { display: flex; justify-content: space-between; padding: 3px 6px; }
.inv-total-row.grand { background: #041E26; color: #fff; font-weight: bold; border-radius: 4px; font-size: 13px; padding: 6px; }
​.toast { position: fixed; z-index: 40; left: 50%; bottom: 24px; transform: translate(-50%, 20px); padding: 12px 20px; border-radius: 8px; background: #fff; color: #000; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: all .2s; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
​<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
​<header class="top">
<div class="inner">
<div class="brand">
<h1>Clima Hogar Multi Servicios</h1>
<p>Módulo de Facturación Oficial y Comprobantes</p>
</div>
<div class="top-actions">
<button type="button" class="btn" onclick="window.location.href='index.html'">← Volver al Sistema</button>
<button type="button" class="btn primary" onclick="descargarPDF()">📥 Descargar Factura PDF</button>
</div>
</div>
</header>
​<main class="inner">
<div class="layout">
<!-- PANEL DE CONFIGURACIÓN Y CAPTURA -->
<div class="panel">
<h2>1. Datos de la Factura</h2>
<div class="form-grid">
<div class="fld">
<label>Folio</label>
<input type="text" id="f-folio" value="CH-2026-089" oninput="actualizarPreview()">
</div>
<div class="fld">
<label>Fecha</label>
<input type="date" id="f-fecha" onchange="actualizarPreview()">
</div>
</div>
<div class="form-grid">
<div class="fld">
<label>Cliente</label>
<input type="text" id="f-cliente" value="CETis 116 &quot;Antonia Nava de Catalán&quot;" oninput="actualizarPreview()">
</div>
<div class="fld">
<label>Ubicación / Ciudad</label>
<input type="text" id="f-ubicacion" value="Acapulco, Guerrero" oninput="actualizarPreview()">
</div>
</div>
<div class="form-grid">
<div class="fld">
<label>Método de Pago</label>
<input type="text" id="f-pago" value="Transferencia / Efectivo" oninput="actualizarPreview()">
</div>
<div class="fld">
<label>Aplicar I.V.A. (16%)</label>
<select id="f-iva" onchange="actualizarPreview()">
<option value="si" selected>Sí (16% IVA)</option>
<option value="no">No (Sin IVA)</option>
</select>
</div>
</div>
<div class="fld">
<label>Resumen Técnico de Servicios</label>
<textarea id="f-resumen" oninput="actualizarPreview()">Mantenimiento preventivo y correctivo de sistemas de aire acondicionado en instalaciones del plantel.</textarea>
</div>
​<h2 style="margin-top:24px;">2. Conceptos de Servicios y Refacciones</h2>
<div style="display:flex;gap:8px;margin-bottom:12px;">
<button type="button" class="btn small primary" onclick="agregarRenglon()">+ Agregar Concepto Libre</button>
<button type="button" class="btn small" onclick="cargarEquiposRecientes()">+ Importar Equipos de la App</button>
</div>
​<div style="overflow-x:auto;">
<table class="items-table">
<thead>
<tr>
<th style="width:50px;">Cant.</th>
<th>Descripción y Ubicación</th>
<th style="width:90px;">Precio Unit.</th>
<th style="width:40px;"></th>
</tr>
</thead>
<tbody id="conceptos-body">
<!-- Renglones dinámicos -->
</tbody>
</table>
</div>
</div>
​<!-- PANEL DE VISTA PREVIA EN VIVO -->
<div class="panel">
<h2>3. Vista Previa en Vivo (Formato PDF)</h2>
<div id="invoice-preview" class="preview-container">
<!-- El contenido se genera dinámicamente -->
</div>
</div>
</div>
</main>
​<div id="toast" class="toast" role="status" aria-live="polite"></div>
​<script>
var DB = null, currentUser = null;
var conceptos = [
{ cant: 1, desc: 'Reparación de tubería condensadora', precio: 1500 },
{ cant: 1, desc: 'Instalación de aire acondicionado - Ubicación: Aula 19', precio: 2000 },
{ cant: 4, desc: 'Limpieza profunda de aires acondicionados - Ubicación: Biblioteca Escolar', precio: 1500 }
];
​function toast(msg) {
var t = document.getElementById('toast');
t.textContent = msg;
t.classList.add('show');
setTimeout(function () { t.classList.remove('show'); }, 3000);
}
​function formatMoney(n) {
return '$' + Number(n || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
​function renderTablaEdicion() {
var tbody = document.getElementById('conceptos-body');
tbody.innerHTML = conceptos.map(function(item, idx) {
return '<tr>' +
'<td><input type="number" min="1" value="' + item.cant + '" onchange="cambiarItem(' + idx + ', \'cant\', this.value)"></td>' +
'<td><input type="text" value="' + item.desc.replace(/"/g, '"') + '" onchange="cambiarItem(' + idx + ', 'desc', this.value)"></td>' +
'<td><input type="number" step="0.01" value="' + item.precio + '" onchange="cambiarItem(' + idx + ', \'precio\', this.value)"></td>' +
'<td><button type="button" class="btn small danger" onclick="eliminarItem(' + idx + ')">✕</button></td>' +
'</tr>';
}).join('');
actualizarPreview();
}
​function cambiarItem(idx, campo, val) {
conceptos[idx][campo] = campo === 'cant' || campo === 'precio' ? Number(val) : val;
actualizarPreview();
}
​function eliminarItem(idx) {
conceptos.splice(idx, 1);
renderTablaEdicion();
}
​function agregarRenglon() {
conceptos.push({ cant: 1, desc: 'Nuevo servicio de mantenimiento o refacción', precio: 1000 });
renderTablaEdicion();
}
​function cargarEquiposRecientes() {
if (!DB) { toast('Base de datos no conectada.'); return; }
DB.collection('equipos').get().then(function(snap) {
if (snap.empty) { toast('No hay equipos registrados en la app.'); return; }
snap.forEach(function(doc) {
var e = doc.data();
conceptos.push({
cant: 1,
desc: 'Mantenimiento Preventivo de ' + (e.nombre || 'Aire') + ' - Ubicación: ' + (e.aula || 'Zona general'),
precio: 1500
});
});
renderTablaEdicion();
toast('¡Equipos importados correctamente!');
}).catch(function(err) {
toast('Error al importar equipos.');
});
}
​function actualizarPreview() {
var folio = document.getElementById('f-folio').value;
var fechaVal = document.getElementById('f-fecha').value;
var fechaFormateada = fechaVal ? new Date(fechaVal + 'T00:00:00').toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' }) : '28 de Septiembre de 2026';
var cliente = document.getElementById('f-cliente').value;
var ubicacion = document.getElementById('f-ubicacion').value;
var pago = document.getElementById('f-pago').value;
var ivaModo = document.getElementById('f-iva').value;
var resumen = document.getElementById('f-resumen').value;
​var subtotal = 0;
var filasHtml = conceptos.map(function(item) {
var importe = (item.cant || 0) * (item.precio || 0);
subtotal += importe;
return '<tr>' +
'<td>' + item.cant + '</td>' +
'<td>' + item.desc + '</td>' +
'<td class="num">' + formatMoney(item.precio) + '</td>' +
'<td class="num">' + formatMoney(importe) + '</td>' +
'</tr>';
}).join('');
​var ivaMonto = ivaModo === 'si' ? subtotal * 0.16 : 0;
var totalGeneral = subtotal + ivaMonto;
​var previewHtml =
'<div class="inv-header">' +
'<div class="inv-logo-area">' +
'<div class="inv-logo-box">CH</div>' +
'<div class="inv-company">' +
'<h3>Clima Hogar Multi Servicios</h3>' +
'<p>Soluciones Completas para tu Hogar e Institución
Especialistas en Aire Acondicionado y Electricidad
Acapulco, Gro. | Tel: 744 533 1689</p>' +
'</div>' +
'</div>' +
'<div class="inv-folio-box">' +
'<h2>Factura</h2>' +
'<p><b>Folio:</b> ' + folio + '
<b>Fecha:</b> ' + fechaFormateada + '
<b>Método:</b> ' + pago + '</p>' +
'</div>' +
'</div>' +
'<div class="inv-client-box">' +
'<div><strong>FACTURAR A:</strong>
Cliente: ' + cliente + '
Ubicación: ' + ubicacion + '</div>' +
'<div style="text-align:right;"><strong>CONDICIONES:</strong>
Contado / Institucional</div>' +
'</div>' +
'<div class="inv-summary-bar"><strong>RESUMEN TÉCNICO:</strong> ' + resumen + '</div>' +
'<table class="pdf-table">' +
'<thead>' +
'<tr>' +
'<th style="width:40px;">Cant.</th>' +
'<th>Descripción del Servicio, Material y Ubicación</th>' +
'<th class="num" style="width:80px;">Precio Unit.</th>' +
'<th class="num" style="width:80px;">Importe</th>' +
'</tr>' +
'</thead>' +
'<tbody>' + filasHtml + '</tbody>' +
'</table>' +
'<div class="inv-totals">' +
'<div class="inv-totals-box">' +
'<div class="inv-total-row"><span>Subtotal:</span><span>' + formatMoney(subtotal) + '</span></div>' +
(ivaModo === 'si' ? '<div class="inv-total-row"><span>I.V.A. (16%):</span><span>' + formatMoney(ivaMonto) + '</span></div>' : '') +
'<div class="inv-total-row grand"><span>Total General:</span><span>' + formatMoney(totalGeneral) + '</span></div>' +
'</div>' +
'</div>' +
'<div style="margin-top:20px;text-align:center;font-size:9px;color:#666;border-top:1px solid #eee;padding-top:6px;">' +
'Clima Hogar Multi Servicios | Factura Oficial y Comprobante de Servicios · Página 1 de 1' +
'</div>';
​document.getElementById('invoice-preview').innerHTML = previewHtml;
}
​function descargarPDF() {
var element = document.getElementById('invoice-preview');
var folio = document.getElementById('f-folio').value || 'Factura';
var opt = {
margin:       10,
filename:     'Factura_' + folio + '_CETis116.pdf',
image:        { type: 'jpeg', quality: 0.98 },
html2canvas:  { scale: 2, useCORS: true },
jsPDF:        { unit: 'mm', format: 'letter', orientation: 'portrait' }
};
toast('Generando PDF...');
html2pdf().from(element).set(opt).save().then(function() {
toast('¡Factura descargada con éxito!');
});
}
​// Inicializar Firebase
function init() {
var firebaseConfig = {
apiKey: "AIzaSyA_JufV6ZSCICVuUrVZEJropD1VKA2bzQs",
authDomain: "mantenimientocetis116.firebaseapp.com",
databaseURL: "https://mantenimientocetis116-default-rtdb.firebaseio.com",
projectId: "mantenimientocetis116",
storageBucket: "mantenimientocetis116.firebasestorage.app",
messagingSenderId: "556796465966",
appId: "1:556796465966:web:b0636bf4ee5ba99c21a0bf"
};
firebase.initializeApp(firebaseConfig);
firebase.auth().onAuthStateChanged(function(user) {
if (!user) {
window.location.href = 'login.html';
return;
}
currentUser = user;
DB = firebase.firestore();
​// Fecha por defecto hoy
var hoy = new Date().toISOString().split('T')[0];
document.getElementById('f-fecha').value = hoy;
renderTablaEdicion();
});
}
init();
</script>
​</body>
</html>
