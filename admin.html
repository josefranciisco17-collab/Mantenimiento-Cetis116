<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Gerencial - TermoBit 116</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #04080C; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card { background: #0B131A; border: 1px solid #1E293B; padding: 35px; border-radius: 20px; width: 100%; max-width: 420px; box-shadow: 0 25px 50px rgba(0,0,0,0.7); }
    .badge { background: rgba(6, 182, 212, 0.1); color: #06B6D4; font-size: 11px; text-transform: uppercase; font-weight: 800; padding: 6px 12px; border-radius: 20px; display: inline-block; margin-bottom: 15px; border: 1px solid rgba(6, 182, 212, 0.3); }
    h2 { color: #fff; font-size: 24px; margin-bottom: 6px; font-weight: 800; }
    p { color: #94A3B8; font-size: 13px; margin-bottom: 25px; }
    .input-group { margin-bottom: 18px; }
    label { display: block; font-size: 11px; color: #94A3B8; margin-bottom: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    input { width: 100%; padding: 14px 16px; background: #04080C; border: 1px solid #334155; border-radius: 10px; color: #fff; font-size: 14px; outline: none; transition: all 0.2s; }
    input:focus { border-color: #06B6D4; box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.15); }
    .btn-admin { width: 100%; background: linear-gradient(135deg, #06B6D4, #0891B2); color: #041E26; border: none; padding: 14px; font-weight: 800; border-radius: 10px; cursor: pointer; font-size: 15px; margin-top: 10px; transition: filter 0.2s; }
    .btn-admin:hover { filter: brightness(1.15); }
    .back-link { display: block; text-align: center; margin-top: 25px; color: #64748B; font-size: 13px; text-decoration: none; transition: color 0.2s; }
    .back-link:hover { color: #06B6D4; }
    #error-msg { background: rgba(239, 68, 68, 0.15); border: 1px solid #EF4444; color: #FCA5A5; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; text-align: center; display: none; font-weight: 500; }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="badge">By JFAM TECNO-ENERGY</div>
    <h2>Acceso Gerencial</h2>
    <p>Área exclusiva para supervisión y administración de sistemas.</p>

    <div id="error-msg"></div>

    <form id="admin-form" onsubmit="handleAdminLogin(event)">
      <div class="input-group">
        <label>Correo de Administrador</label>
        <input type="email" id="admin-email" required placeholder="tucorreo@empresa.com">
      </div>

      <div class="input-group">
        <label>Contraseña</label>
        <input type="password" id="admin-password" required placeholder="••••••••">
      </div>

      <div class="input-group">
        <label>Llave de Autorización Maestra</label>
        <input type="password" id="admin-key" required placeholder="Código PIN de seguridad">
      </div>

      <button type="submit" class="btn-admin">Verificar e Ingresar</button>
    </form>

    <a href="login.html" class="back-link">← Volver al acceso general de trabajadores</a>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script>
        const firebaseConfig = {
      apiKey: "AIzaSyA_JufV6ZSCICVuUrVZEJropD1VKA2bzQs",
      authDomain: "mantenimientocetis116.firebaseapp.com",
      projectId: "mantenimientocetis116",
      storageBucket: "mantenimientocetis116.firebasestorage.app",
      messagingSenderId: "556796465966",
      appId: "1:556796465966:web:b0636bf4ee5ba99c21a0bf"
          
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();

    // 1. TU LLAVE SECRETA MAESTRA
    const LLAVE_MAESTRA = "4864";

    // 2. CORREOS AUTORIZADOS COMO ADMINISTRADORES (Pon aquí el tuyo y el de tu compañero)
    const CORREOS_ADMINS = [
      "josefranciisco17@gmail.com",
      "compañero@gmail.com"
    ];

    function handleAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('admin-email').value.trim().toLowerCase();
      const password = document.getElementById('admin-password').value;
      const key = document.getElementById('admin-key').value;
      const errorDiv = document.getElementById('error-msg');

      errorDiv.style.display = 'none';

      // Validar llave maestra
      if (key !== LLAVE_MAESTRA) {
        errorDiv.textContent = "Acceso denegado: La llave de seguridad es incorrecta.";
        errorDiv.style.display = 'block';
        return;
      }

      // Validar si el correo está autorizado para rol gerencial
      if (!CORREOS_ADMINS.includes(email)) {
        errorDiv.textContent = "Acceso denegado: Este correo no cuenta con privilegios de administrador.";
        errorDiv.style.display = 'block';
        return;
      }

      // Autenticar en Firebase
      auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
          // Guardamos en la memoria local del navegador que esta sesión es de tipo ADMIN
          localStorage.setItem('termobit_rol', 'admin');
          window.location.href = "index.html";
        })
        .catch((error) => {
          errorDiv.textContent = "Error: Credenciales de Firebase inválidas o contraseña incorrecta.";
          errorDiv.style.display = 'block';
        });
    }
  </script>
</body>
</html>
