<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Módulo de Dictámenes · Clima Hogar</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root { 
      --bg-gradient: linear-gradient(135deg, #0284c7 0%, #0369a1 50%, #0f172a 100%);
      --surface: rgba(15, 23, 42, 0.85);
      --surface-2: rgba(30, 41, 59, 0.7);
      --line: rgba(255, 255, 255, 0.12);
      --ink: #f8fafc;
      --ink-2: #94a3b8;
      --accent: #38bdf8;
      --accent-ink: #0f172a;
      --good: #10b981;
      --bad: #ef4444;
    }
    body { 
      margin: 0; 
      background: var(--bg-gradient); 
      background-attachment: fixed;
      color: var(--ink); 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      padding: 16px; 
      box-sizing: border-box;
    }
    .container { max-width: 800px; margin: 0 auto; padding-bottom: 40px; }
    
    .header-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .header-title { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; margin: 0 0 4px; color: #fff; text-transform: uppercase; letter-spacing: 0.5px; }
    .header-subtitle { font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 16px; }

    .actions-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .btn { 
      padding: 12px 14px; 
      border-radius: 12px; 
      font-weight: 700; 
      font-size: 12px; 
      text-transform: uppercase; 
      cursor: pointer; 
      border: 1px solid var(--line); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 6px; 
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn-secondary { background: var(--surface-2); color: var(--ink); }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .card h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; color: #fff; margin-top: 0; margin-bottom: 16px; text-transform: uppercase; border-bottom: 1px solid var(--line); padding-bottom: 8px; }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 11px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
    input, select, textarea { 
      width: 100%; 
      padding: 12px; 
      background: var(--surface-2); 
      border: 1px solid var(--line); 
      border-radius: 10px; 
      color: #fff; 
      font-size: 14px; 
      box-sizing: border-box; 
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  </style>
</head>
<body>

<div class="container">
  
  <div class="header-card">
    <div class="header-title">Clima Hogar Multi Servicios</div>
    <div class="header-subtitle">Módulo de Dictámenes Técnicos · CETis 116</div>

    <div class="actions-grid">
      <button class="btn btn-secondary" onclick="window.location.href='index.html'">Volver al Sistema</button>
      <button class="btn btn-primary" onclick="window.print()">Descargar Dictamen PDF</button>
    </div>
  </div>

  <div class="card">
    <h2>1. Datos Generales del Dictamen</h2>
    
    <div class="form-group">
      <label>Folio del Dictamen</label>
      <input type="text" value="DIC-2026-042" readonly>
    </div>

    <div class="form-group">
      <label>Fecha de Emisión</label>
      <input type="text" value="10/11/2026" readonly>
    </div>

    <div class="form-group">
      <label>Institución / Plantel</label>
      <input type="text" value="CETis 116 Antonia Nava de Catalán" readonly>
    </div>

    <div class="form-group">
      <label>Ubicación</label>
      <input type="text" value="Acapulco de Juárez, Guerrero" readonly>
    </div>

    <div class="form-group">
      <label>Estado Operativo de los Equipos Evaluados</label>
      <input type="text" value="Operativo / Mantenimiento Preventivo y Correctivo Concluido" readonly>
    </div>

    <div class="form-group">
      <label>Evaluación y Diagnóstico Técnico</label>
      <textarea rows="4" readonly>Se emite dictamen favorable tras la revisión integral, limpieza profunda, reparaciones de tuberías condensadoras y cargas de gas refrigerante en las instalaciones del plantel, garantizando el óptimo funcionamiento para las actividades académicas y administrativas.</textarea>
    </div>
  </div>

  <div class="card">
    <h2>2. Responsable Técnico</h2>
    <div class="form-group">
      <label>Prestador de Servicios</label>
      <input type="text" value="Clima Hogar Multi Servicios / JFAM Tecno-Energy" readonly>
    </div>
    <div class="form-group">
      <label>Autorizado por</label>
      <input type="text" value="José Francisco Abarca Marcelo (DGTIC / CETis 116)" readonly>
    </div>
  </div>

</div>

</body>
</html>
