<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Acceso · Clima Hogar</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root { --bg: #030712; --surface: #0f172a; --surface-2: #1e293b; --ink: #f8fafc; --ink-2: #94a3b8; --line: #334155; --accent: #06b6d4; --accent-ink: #082f49; --bad: #ef4444; --good: #10b981; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Plus Jakarta Sans', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; box-sizing: border-box; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    h1 { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; text-align: center; margin: 0 0 4px; color: #fff; text-transform: uppercase; }
    .subtitle { text-align: center; font-size: 12px; color: var(--ink-2); text-transform: uppercase; margin-bottom: 20px; letter-spacing: 0.5px; }
    
    .tabs { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 4px; margin-bottom: 20px; }
    .tab { flex: 1; padding: 10px; background: transparent; border: 0; color: var(--ink-2); font-weight: 600; font-size: 13px; text-transform: uppercase; cursor: pointer; border-radius: 6px; text-align: center; }
    .tab.active { background: var(--accent); color: var(--accent-ink); }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; color: #fff; font-size: 15px; box-sizing: border-box; }
    input:focus { outline: none; border-color: var(--accent); }
    
    .btn-submit { width: 100%; padding: 12px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; font-weight: 700; font-size: 14px; text-transform: uppercase; cursor: pointer; margin-top: 10px; }
    .hidden { display: none; }
    .msg { margin-top: 14px; font-size: 13px; text-align: center; }
  </style>
</head>
<body>

<div class="card">
  <h1>Clima Hogar</h1>
  <div class="subtitle">Control de Accesos · CETis 116</div>

  <div class="tabs">
    <button type="button" class="tab active" id="btn-login" onclick="cambiarModo('login')">Iniciar Sesión</button>
    <button type="button" class="tab" id="btn-reg" onclick="cambiarModo('registro')">Registrarse</button>
  </div>

  <form id="auth-form" onsubmit="manejarAccion(event)">
    <div class="form-group">
      <label>Correo Electrónico</label>
      <input type="email" id="email" required placeholder="correo@dominio.com">
    </div>

    <!-- Campo nuevo de Teléfono / WhatsApp (Solo visible en Registro) -->
    <div class="form-group hidden" id="group-telefono">
      <label>Número de WhatsApp (10 dígitos)</label>
      <input type="tel" id="telefono" placeholder="7441234567">
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="password" required placeholder="Mínimo 6 caracteres">
    </div>

    <button type="submit" class="btn-submit" id="submit-btn">Iniciar Sesión</button>
  </form>

  <div class="msg" id="msg-status"></div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
  var firebaseConfig = {
    apiKey: "AIzaSyA_JufV6ZSCICVuUrVZEJropD1VKA2bzQs",
    authDomain: "mantenimientocetis116.firebaseapp.com",
    databaseURL: "https://mantenimientocetis116-default-rtdb.firebaseio.com",
    projectId: "mantenimientocetis116",
    storageBucket: "mantenimientocetis116.firebasestorage.app",
    messagingSenderId: "556796465966",
    appId: "1:556796465966:web:b0636bf4ee5ba99c21a0bf"
  };

  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();

  var modoActual = 'login';

  window.cambiarModo = function(modo) {
    modoActual = modo;
    var esLogin = (modo === 'login');
    document.getElementById('btn-login').classList.toggle('active', esLogin);
    document.getElementById('btn-reg').classList.toggle('active', !esLogin);
    document.getElementById('submit-btn').textContent = esLogin ? 'Iniciar Sesión' : 'Registrarse y Entrar';
    document.getElementById('group-telefono').classList.toggle('hidden', esLogin);
    document.getElementById('msg-status').textContent = '';
  };

  window.manejarAccion = async function(e) {
    e.preventDefault();
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    var telefono = document.getElementById('telefono').value.trim();
    var statusEl = document.getElementById('msg-status');

    statusEl.style.color = '#fff';
    statusEl.textContent = 'Procesando...';

    try {
      if (modoActual === 'login') {
        var cred = await auth.signInWithEmailAndPassword(email, password);
        var userDoc = await db.collection('usuarios_registrados').doc(cred.user.uid).get();
        
        if (email === 'josefranciisco17@gmail.com' || (userDoc.exists && userDoc.data().aprobado === true)) {
          window.location.href = 'index.html';
        } else {
          auth.signOut();
          statusEl.style.color = 'var(--bad)';
          statusEl.textContent = 'Tu cuenta está pendiente de aprobación por el administrador.';
        }
      } else {
        if (!telefono) {
          statusEl.style.color = 'var(--bad)';
          statusEl.textContent = 'Por favor ingresa tu número de WhatsApp.';
          return;
        }
        var cred = await auth.createUserWithEmailAndPassword(email, password);
        await db.collection('usuarios_registrados').doc(cred.user.uid).set({
          email: email,
          telefono: telefono,
          aprobado: false,
          fechaRegistro: new Date().toISOString(),
          permisos: { addService: false, editService: false, facturar: false, dictamen: false }
        });
        statusEl.style.color = 'var(--good)';
        statusEl.textContent = '¡Registro exitoso! Cuenta pendiente de aprobación.';
        setTimeout(function() { cambiarModo('login'); }, 2500);
      }
    } catch (err) {
      statusEl.style.color = 'var(--bad)';
      statusEl.textContent = 'Error: ' + err.message;
    }
  };
</script>

</body>
</html>
