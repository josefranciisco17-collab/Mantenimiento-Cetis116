<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso - Bitácora de Climas</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg: #0E171C; --surface: #152229; --ink: #E6EEF1; --ink-2: #9DB0B9; --line: #2A3F49;
      --accent: #4CC3D6; --accent-ink: #04222A; --bad: #FF8A80; --bad-soft: #3F1B18;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 'IBM Plex Sans', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
    .card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
    h1 { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; text-transform: uppercase; margin-bottom: 6px; letter-spacing: .02em; }
    p.sub { color: var(--ink-2); font-size: 14px; margin-bottom: 20px; }
    .fld { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    label { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); }
    input { width: 100%; height: 46px; padding: 0 12px; background: var(--bg); border: 1.5px solid var(--line); border-radius: 4px; color: var(--ink); font-size: 16px; }
    input:focus { outline: none; border-color: var(--accent); }
    .btn { width: 100%; height: 46px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 4px; font-weight: 600; font-size: 16px; margin-top: 10px; cursor: pointer; }
    .btn:hover { filter: brightness(1.1); }
    .err { margin-top: 12px; padding: 10px; background: var(--bad-soft); color: var(--bad); border-radius: 4px; font-size: 13px; text-align: center; }
  </style>
</head>
<body>

<div class="card">
  <h1>Bitácora de Climas</h1>
  <p class="sub">Inicia sesión para acceder al sistema</p>
  
  <form id="login-form">
    <div class="fld">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" required autocomplete="email">
    </div>
    <div class="fld">
      <label for="password">Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn">Entrar al Sistema</button>
    <div id="error-box" class="err" hidden></div>
  </form>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script>
  // Tus credenciales de Firebase
  var firebaseConfig = {
    apiKey: "AIzaSyA_JufV6ZSCICVuUrVZEJropD1VKA2bzQs",
    authDomain: "mantenimientocetis116.firebaseapp.com",
    databaseURL: "https://mantenimientocetis116-default-rtdb.firebaseio.com",
    projectId: "mantenimientocetis116",
    storageBucket: "mantenimientocetis116.firebasestorage.app",
    messagingSenderId: "556796465966",
    appId: "1:556796465966:web:b0636bf4ee5ba99c21a0bf"
  };

  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();

  // Redirigir si ya hay sesión activa
  auth.onAuthStateChanged(function(user) {
    if (user) {
      window.location.href = 'index.html';
    }
  });

  document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var email = document.getElementById('email').value;
    var password = document.getElementById('password').value;
    var errBox = document.getElementById('error-box');
    errBox.hidden = true;

    auth.signInWithEmailAndPassword(email, password)
      .then(function(userCredential) {
        // Redirige a la bitácora principal al iniciar sesión con éxito
        window.location.href = 'index.html';
      })
      .catch(function(error) {
        errBox.textContent = 'Correo o contraseña incorrectos.';
        errBox.hidden = false;
      });
  });
</script>

</body>
</html>
