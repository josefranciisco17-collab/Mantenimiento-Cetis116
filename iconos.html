<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generador Oficial - Clima CETis 116</title>
  <style>
    body { background: #04080C; color: #fff; font-family: system-ui, sans-serif; text-align: center; padding: 20px; }
    .box { display: inline-block; margin: 15px; background: #0B131A; padding: 25px; border-radius: 20px; border: 1px solid #1E293B; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
    canvas { background: #0B131A; border-radius: 16px; display: block; margin: 0 auto 15px auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .btn { background: linear-gradient(135deg, #06B6D4, #0891B2); color: #041E26; border: none; padding: 12px 24px; font-weight: 800; border-radius: 10px; cursor: pointer; font-size: 14px; letter-spacing: 0.5px; }
    .btn:hover { filter: brightness(1.15); }
  </style>
</head>
<body>

  <h1>Iconos Oficiales - Clima CETis 116</h1>
  <p>Versión elegante y corporativa con tu firma By JFAM TECNO-ENERGY.</p>

  <div>
    <div class="box">
      <h3>192 x 192 px</h3>
      <canvas id="c192" width="192" height="192"></canvas>
      <button class="btn" onclick="descargar('c192', 'icono-192.png')">Descargar 192</button>
    </div>
    
    <div class="box">
      <h3>512 x 512 px</h3>
      <canvas id="c512" width="512" height="512"></canvas>
      <button class="btn" onclick="descargar('c512', 'icono-512.png')">Descargar 512</button>
    </div>
  </div>

  <script>
    function renderIcon(canvasId) {
      var canvas = document.getElementById(canvasId);
      var ctx = canvas.getContext('2d');
      var w = canvas.width;
      var h = canvas.height;

      // 1. Fondo de lujo con gradiente radial y profundidad
      var bgGrad = ctx.createRadialGradient(w/2, h/3, w*0.1, w/2, h/2, w*0.7);
      bgGrad.addColorStop(0, '#101D28');
      bgGrad.addColorStop(1, '#050B10');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      // 2. Borde interior metálico/cian muy sutil
      ctx.strokeStyle = 'rgba(6, 182, 212, 0.35)';
      ctx.lineWidth = w * 0.02;
      ctx.strokeRect(w * 0.04, h * 0.04, w * 0.92, h * 0.92);

      var cx = w / 2;
      var cy = h * 0.36;

      // 3. Isotipo de MiniSplit Elegante
      var acW = w * 0.50;
      var acH = h * 0.22;
      var acX = cx - acW / 2;
      var acY = cy - acH / 2;

      // Cuerpo del equipo
      var acGrad = ctx.createLinearGradient(acX, acY, acX, acY + acH);
      acGrad.addColorStop(0, '#0891B2');
      acGrad.addColorStop(1, '#0E7490');
      ctx.fillStyle = acGrad;
      ctx.fillRect(acX, acY, acW, acH);

      // Panel central oscuro de alta tecnología
      ctx.fillStyle = '#04080C';
      ctx.fillRect(acX + w * 0.04, acY + acH * 0.32, acW - w * 0.08, acH * 0.36);

      // LED indicador de estado estilo neón brillante
      ctx.fillStyle = '#34D399';
      ctx.beginPath();
      ctx.arc(acX + acW - w * 0.08, acY + acH * 0.5, w * 0.025, 0, Math.PI * 2);
      ctx.fill();

      // 4. Ondas de enfriamiento dinámicas
      ctx.strokeStyle = '#22D3EE';
      ctx.lineWidth = w * 0.03;
      ctx.lineCap = 'round';
      
      ctx.beginPath();
      ctx.moveTo(cx - w * 0.14, acY + acH + w * 0.05);
      ctx.quadraticCurveTo(cx, acY + acH + w * 0.12, cx + w * 0.14, acY + acH + w * 0.05);
      ctx.stroke();

      // 5. Textos institucionales con jerarquía tipográfica
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold ' + Math.round(w * 0.10) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('CETis 116', cx, h * 0.68);

      // Firma comercial "BY JFAM TECNO-ENERGY"
      ctx.fillStyle = '#38BDF8';
      ctx.font = 'bold ' + Math.round(w * 0.042) + 'px sans-serif';
      ctx.fillText('BY JFAM TECNO-ENERGY', cx, h * 0.83);
    }

    window.onload = function() {
      renderIcon('c192');
      renderIcon('c512');
    };

    function descargar(canvasId, filename) {
      var canvas = document.getElementById(canvasId);
      var link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>

</body>
</html>
