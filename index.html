<style>
:root {

  --surface: #FFFFFF;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E171C; --surface: #152229; --surface-2: #1C2D35; --ink: #E6EEF1; --ink-2: #9DB0B9; --line: #2A3F49;
    --accent: #4CC3D6; --accent-ink: #04222A; --accent-soft: #14343C;
    --ok: #5FD08F; --ok-soft: #16301F; --warn: #F0B650; --warn-soft: #3A2B0E; --bad: #FF8A80; --bad-soft: #3F1B18;

:root[data-theme="dark"] {
  --bg: #0E171C; --surface: #152229; --surface-2: #1C2D35; --ink: #E6EEF1; --ink-2: #9DB0B9; --line: #2A3F49;
  --accent: #4CC3D6; --accent-ink: #04222A; --accent-soft: #14343C;
  --ok: #5FD08F; --ok-soft: #16301F; --warn: #F0B650; --warn-soft: #3A2B0E; --bad: #FF8A80; --bad-soft: #3F1B18;
  --scrim: rgba(0, 0, 0, .62);

* { box-sizing: border-box; }

body.lock { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.inner { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Masthead */
.top { padding-block: 22px 16px; }
.top .inner { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.brand { min-width: 0; }

.top-actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 16px; border: 1.5px solid var(--line); border-radius: 4px; background: var(--surface); font-weight: 500; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.danger.solid { background: var(--bad); color: var(--bg); }
.btn.small { min-height: 32px; padding: 4px 12px; font-size: 14px; }
.btn[disabled] { opacity: .55; cursor: default; }
.link { background: none; border: 0; padding: 4px 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

/* Search band */
.band { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.band .inner { display: flex; flex-direction: column; gap: 10px; padding-block: 10px 12px; }
.search { position: relative; display: block; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; color: var(--ink-2); pointer-events: none; }
.search input { width: 100%; height: 54px; padding: 0 14px 0 46px; font-size: 17px; background: var(--surface); border: 2px solid var(--line); border-radius: 6px; }
.search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search input::placeholder { color: var(--ink-2); opacity: .85; }
.tabs { display: flex; gap: 4px; padding: 3px; background: var(--surface-2); border-radius: 6px; align-self: flex-start; max-width: 100%; }
.tabs button { min-height: 36px; padding: 4px 16px; border: 0; border-radius: 4px; background: transparent; font-weight: 500; color: var(--ink-2); }
.tabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.tabs .n { font-family: var(--font-mono); font-size: 12px; margin-left: 4px; color: var(--ink-2); }

main { padding-block: 16px 24px; }
.banner { margin-bottom: 14px; padding: 10px 14px; background: var(--surface-2); border-radius: 4px; color: var(--ink-2); font-size: 14px; }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.note { color: var(--ink-2); padding: 24px 0; }

/* Filters */
.filters { display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }

.chip b { font: 500 12px var(--font-mono); margin-left: 6px; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.selects { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 14px; }
.sel { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; min-width: 0; }
.sel select, .sel input { min-height: 38px; padding: 4px 10px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 4px; font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--ink); max-width: 100%; }
.count { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 16px; color: var(--ink-2); font-size: 14px; margin-bottom: 14px; }
.count .tot { font-variant-numeric: tabular-nums; }

/* Aula groups and equipment cards */
.grp { margin-bottom: 26px; }
.grp > h2 { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-bottom: 10px; font-size: 14px; font-weight: 400; color: var(--ink-2); }

.plate.sm { font-size: 14px; padding: 0 7px; border-width: 1px; letter-spacing: .05em; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.eq { display: flex; flex-direction: column; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.eq-open { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 14px; border: 0; background: none; text-align: left; border-radius: 6px 6px 0 0; }
.eq-open:hover .eq-name { text-decoration: underline; text-underline-offset: 3px; }
.eq-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.eq-name { font: 600 22px/1.1 var(--font-display); letter-spacing: .01em; min-width: 0; overflow-wrap: anywhere; }
.eq-sub { color: var(--ink-2); font-size: 14px; overflow-wrap: anywhere; }
.eq-meta { display: grid; gap: 2px; margin-top: 4px; font-size: 14px; font-variant-numeric: tabular-nums; }
.eq-meta .k, .k { display: inline-block; min-width: 62px; color: var(--ink-2); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.via { font-size: 13px; color: var(--accent); }
.eq-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 14px; border-top: 1px solid var(--line); min-height: 48px; }
.mono { font-family: var(--font-mono); font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; min-width: 0; }

mark { background: var(--accent-soft); color: inherit; border-radius: 2px; padding: 0 1px; box-shadow: inset 0 -2px 0 var(--accent); }

/* Badges and tags */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); }
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.tag::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--ink-2); }
.tag.prev::before { background: var(--accent); }
.tag.corr::before { background: var(--warn); }
.tag.rep::before { background: var(--bad); }

/* Service log rows */
.log { display: grid; gap: 8px; }
.sv { display: grid; grid-template-columns: 104px minmax(0, 1.6fr) minmax(0, 1fr) 96px; grid-template-areas: "date main meta cost"; gap: 4px 16px; align-items: start; width: 100%; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; text-align: left; }
.sv:hover { border-color: var(--ink-2); }
.sv-date { grid-area: date; font: 600 18px/1.2 var(--font-display); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.sv-main { grid-area: main; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.sv-eq { font-weight: 600; overflow-wrap: anywhere; }
.sv-work { color: var(--ink-2); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.sv-meta { grid-area: meta; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; font-size: 14px; }
.sv-tec { color: var(--ink-2); overflow-wrap: anywhere; }
.sv-cost { grid-area: cost; text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
@media (max-width: 720px) {
  .sv { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "date cost" "main main" "meta meta"; }
  .sv-meta { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
}

.empty { max-width: 520px; padding: 36px 0; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.empty h2 { font: 700 32px/1.1 var(--font-display); text-transform: uppercase; text-wrap: balance; }
.empty p { color: var(--ink-2); }
.empty .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.empty.small { padding: 24px 0; }
.empty.small h2 { font-size: 26px; }

footer { padding-block: 8px 48px; color: var(--ink-2); font-size: 13px; }
footer .inner { display: flex; flex-wrap: wrap; gap: 6px 20px; border-top: 1px solid var(--line); padding-top: 14px; }

/* Side sheet */
.overlay { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; justify-content: flex-end; }
.sheet { width: min(600px, 100%); height: 100%; overflow-y: auto; overscroll-behavior: contain; background: var(--bg); padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); box-shadow: -8px 0 30px rgba(0, 0, 0, .25); }
.sheet-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.sheet-h h2 { font: 700 30px/1.05 var(--font-display); text-transform: uppercase; overflow-wrap: anywhere; text-wrap: balance; }
.x { flex: none; width: 40px; height: 40px; border: 1.5px solid var(--line); border-radius: 4px; background: var(--surface); font-size: 20px; line-height: 1; }
.det-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 14px; }
.attrs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 12px 16px; margin: 0 0 14px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.attrs div { min-width: 0; }
.attrs dt { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
.attrs dd { margin: 0; overflow-wrap: anywhere; }
.notes { margin-bottom: 14px; padding: 10px 14px; background: var(--surface-2); border-radius: 4px; color: var(--ink-2); font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px 12px; margin-bottom: 14px; border: 1.5px solid var(--bad); border-radius: 4px; color: var(--bad); }
.confirm span { flex: 1 1 200px; }
.hist-t { font: 600 22px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 10px; }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.hi { padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; display: grid; gap: 8px; }
.hi-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.hi-date { font: 600 20px/1.1 var(--font-display); letter-spacing: .02em; }
.hi-h .sp { flex: 1; }
.hi p { overflow-wrap: anywhere; }
.hi dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: 6px 14px; margin: 0; font-size: 14px; }
.hi dt { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
.hi dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.hist-empty { padding: 18px; border: 1.5px dashed var(--line); border-radius: 6px; color: var(--ink-2); }

/* Forms */
.form { display: grid; gap: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 14px; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld label { font-size: 13px; font-weight: 600; }
.fld .req { color: var(--bad); }
.fld input, .fld select, .fld textarea { width: 100%; min-height: 42px; padding: 8px 10px; font-size: 16px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 4px; }
.fld textarea { min-height: 96px; resize: vertical; }
.fld input:focus, .fld select:focus, .fld textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.fld [aria-invalid="true"] { border-color: var(--bad); }
.err { color: var(--bad); font-size: 13px; }
.hint { color: var(--ink-2); font-size: 13px; }
.form-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }

.toast { position: fixed; z-index: 30; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 6px; background: var(--ink); color: var(--bg); font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

      fld('Notas', 'notas', e.notas || '', { area: 1, ph: 'Detalles del equipo, condiciones del lugar, accesos' }) +

  function formSv(s, eqId) {
    var fecha = s ? s.fecha : todayIso();
    var tipo = s ? s.tipo : 'Preventivo';
    var prox = s ? (s.proximo || '') : addMonths(fecha, 6);

    var opts = [['', 'Selecciona un equipo']].concat(eqs.map(function (e) { return [e.id, e.nombre + ' · ' + (e.aula || 'Sin aula')]; }));

      sel('Equipo', 'equipoId', cur, opts, { req: 1 }) + '<p class="hint" id="x-aula-hint">' + (eq0 ? 'Aula: ' + esc(eq0.aula || 'sin aula') : '') + '</p>' +
      '<div class="grid2">' + fld('Fecha del servicio', 'fecha', fecha, { type: 'date', req: 1 }) + sel('Tipo de servicio', 'tipo', tipo, TIPOS, { req: 1 }) + '</div>' +
      '<div class="grid2">' + sel('Estado', 'estado', s ? (s.estado || 'Completado') : 'Completado', ['Completado', 'Pendiente']) + fld('Folio u orden', 'folio', s ? s.folio || '' : '') + '</div>' +

      '<div class="grid2">' + fld('Técnico', 'tecnico', s ? s.tecnico || '' : '', { list: 'dl-tec' }) + fld('Costo (MXN)', 'costo', s && s.costo != null ? s.costo : '', { type: 'number', step: '0.01', min: 0 }) + '</div>' +
      '<div class="fld"><label for="x-proximo">Próximo servicio</label><input id="x-proximo" name="proximo" type="date" value="' + esc(prox) + '" data-touched="' + (s ? 1 : 0) + '"><p class="hint">En un preventivo se propone a 6 meses. Puedes cambiarla.</p></div>' +
      dlist('dl-tec', tecs) +
      '<div class="form-acts"><button type="submit" class="btn primary">Guardar servicio</button><button type="button" class="btn" data-action="cancel-form">Cancelar</button></div></form>';

  function showErrors(f, errs) {
    f.querySelectorAll('[data-err]').forEach(function (p) { p.hidden = true; var c = f.elements[p.dataset.err]; if (c) c.removeAttribute('aria-invalid'); });
    var first = null;
    Object.keys(errs).forEach(function (k) { var p = f.querySelector('[data-err="' + k + '"]'), c = f.elements[k]; if (p) { p.textContent = errs[k]; p.hidden = false; } if (c) { c.setAttribute('aria-invalid', 'true'); first = first || c; } });
    if (first) first.focus();
  }

  async function saveEq(f) {
    var fd = new FormData(f), v = function (k) { return String(fd.get(k) || '').trim(); }, errs = {};

    if (!v('aula')) errs.aula = 'Indica en qué aula está.';
    if (Object.keys(errs).length) return showErrors(f, errs);
    var old = S.sheet.id ? S.equipos.find(function (x) { return x.id === S.sheet.id; }) : null;
    var obj = { id: old ? old.id : uid('e'), nombre: v('nombre'), aula: v('aula'), edificio: v('edificio'), marca: v('marca'), modelo: v('modelo'), serie: v('serie'), tipo: v('tipo'), capacidad: v('capacidad'), refrigerante: v('refrigerante'), instalacion: v('instalacion'), notas: v('notas'), actualizado: new Date().toISOString() };
    var btn = f.querySelector('[type=submit]'); btn.disabled = true;
    try { await put('equipos', obj); toast('Equipo guardado'); openSheet({ type: 'eq', id: obj.id }); }
    catch (err) { btn.disabled = false; toast(failMsg(err)); }
  }
  async function saveSv(f) {
    var fd = new FormData(f), v = function (k) { return String(fd.get(k) || '').trim(); }, errs = {};
    if (!v('equipoId')) errs.equipoId = 'Selecciona el equipo.';
    if (!v('fecha')) errs.fecha = 'Indica la fecha del servicio.';
    if (Object.keys(errs).length) return showErrors(f, errs);
    var eq = S.equipos.find(function (x) { return x.id === v('equipoId'); });
    var old = S.sheet.id ? S.servicios.find(function (x) { return x.id === S.sheet.id; }) : null;
    var costo = v('costo'), n = costo === '' ? null : Number(costo);
    var obj = { id: old ? old.id : uid('s'), equipoId: v('equipoId'), aula: eq ? eq.aula : (old ? old.aula : ''), fecha: v('fecha'), tipo: v('tipo'), estado: v('estado') || 'Completado', trabajo: v('trabajo'), refacciones: v('refacciones'), tecnico: v('tecnico'), costo: (n == null || isNaN(n)) ? null : n, proximo: v('proximo'), folio: v('folio'), actualizado: new Date().toISOString() };
    var btn = f.querySelector('[type=submit]'); btn.disabled = true;
    try { await put('servicios', obj); toast('Servicio guardado'); openSheet({ type: 'eq', id: obj.equipoId }); }
    catch (err) { btn.disabled = false; toast(failMsg(err)); }
  }
  async function delEq() {
    var id = S.sheet.id; S.busy = true; renderSheet(true);
    try {
      var ss = svOf(id); for (var i = 0; i < ss.length; i++) await del('servicios', ss[i].id);
      await del('equipos', id); S.busy = false; closeSheet(); toast('Equipo eliminado');
    } catch (err) { S.busy = false; renderSheet(true); toast(failMsg(err)); }
  }
  async function delSv(id) {
    S.busy = true; renderSheet(true);
    try { await del('servicios', id); S.busy = false; S.confirm = null; renderSheet(true); toast('Servicio eliminado'); }
    catch (err) { S.busy = false; renderSheet(true); toast(failMsg(err)); }
  }

  async function unseed() {
    if (S.busy) return; S.busy = true; render();

      var ss = S.servicios.filter(function (s) { return s.ejemplo; }), ee = S.equipos.filter(function (e) { return e.ejemplo; });
      for (var i = 0; i < ss.length; i++) await del('servicios', ss[i].id);
      for (var j = 0; j < ee.length; j++) {
        var rest = svOf(ee[j].id); for (var k = 0; k < rest.length; k++) await del('servicios', rest[k].id);
        await del('equipos', ee[j].id);
      }
      toast('Datos de ejemplo borrados');
    } catch (err) { toast(failMsg(err)); }
    S.busy = false; render();

  /* ---------- exportar CSV ---------- */
  var csv = function (rows) { return rows.map(function (r) { return r.map(function (c) { c = c == null ? '' : String(c); return /[",\n\r]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\r\n'); };
  function exportCsv() {
    var rows, name;
    if (S.view === 'servicios') {
      rows = [['Fecha', 'Equipo', 'Aula', 'Edificio', 'Marca', 'Modelo', 'Serie', 'Tipo', 'Estado', 'Trabajo realizado', 'Refacciones', 'Técnico', 'Costo', 'Próximo servicio', 'Folio']];
      svList().forEach(function (x) { var s = x.s, e = x.e || {}; rows.push([s.fecha, e.nombre || '', s.aula || e.aula || '', e.edificio || '', e.marca || '', e.modelo || '', e.serie || '', s.tipo, s.estado, s.trabajo, s.refacciones, s.tecnico, s.costo, s.proximo, s.folio]); });
      name = 'servicios-' + todayIso() + '.csv';
    } else {
      rows = [['Equipo', 'Aula', 'Edificio', 'Marca', 'Modelo', 'Serie', 'Tipo', 'Capacidad', 'Refrigerante', 'Instalación', 'Estado', 'Último servicio', 'Próximo servicio']];
      eqList().filter(function (it) { return S.estado === 'todos' || it.st.k === S.estado; }).forEach(function (it) { var e = it.e; rows.push([e.nombre, e.aula, e.edificio, e.marca, e.modelo, e.serie, e.tipo, e.capacidad, e.refrigerante, e.instalacion, it.st.label, it.st.last ? it.st.last.fecha : '', it.st.next || '']); });
      name = 'equipos-' + todayIso() + '.csv';
    }
    var blob = new Blob(['﻿' + csv(rows)], { type: 'text/csv;charset=utf-8;' });
    var link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = name;
    link.style.display = 'none'; document.body.appendChild(link); link.click(); document.body.removeChild(link);
  }

  /* ---------- eventos ---------- */
  function clearAll() { S.q = ''; S.aula = ''; S.estado = 'todos'; S.tipo = 'todos'; S.desde = ''; S.hasta = ''; $('#q').value = ''; }
  function openSvForm(eqId) {
    if (!S.equipos.length) { toast('Primero registra un equipo.'); openSheet({ type: 'eq-form' }); return; }
    openSheet({ type: 'sv-form', eqId: eqId || '' });
  }
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-action]'); if (!el) return;
    var a = el.dataset.action;
    if (a === 'overlay') { if (ev.target === el) closeSheet(); return; }
    switch (a) {
      case 'tab': S.view = el.dataset.v; render(); break;
      case 'new-eq': openSheet({ type: 'eq-form' }); break;
      case 'new-sv': openSvForm(el.dataset.eq); break;
      case 'open-eq': openSheet({ type: 'eq', id: el.dataset.id }); break;
      case 'edit-eq': openSheet({ type: 'eq-form', id: el.dataset.id }); break;
      case 'edit-sv': { var s = S.servicios.find(function (x) { return x.id === el.dataset.id; }); if (s) openSheet({ type: 'sv-form', id: s.id, eqId: s.equipoId }); break; }
      case 'close-sheet': closeSheet(); break;
      case 'cancel-form': { var sh = S.sheet, back = sh && (sh.type === 'sv-form' ? sh.eqId : sh.id); if (back && S.equipos.some(function (e) { return e.id === back; })) openSheet({ type: 'eq', id: back }); else closeSheet(); break; }
      case 'del-eq-ask': S.confirm = { kind: 'eq' }; renderSheet(true); break;
      case 'del-eq-yes': delEq(); break;
      case 'del-sv-ask': S.confirm = { kind: 'sv', id: el.dataset.id }; renderSheet(true); break;
      case 'del-sv-yes': delSv(el.dataset.id); break;
      case 'cancel-confirm': S.confirm = null; renderSheet(true); break;
      case 'chip-estado': S.estado = el.dataset.v; render(); break;
      case 'chip-tipo': S.tipo = el.dataset.v; render(); break;
      case 'clear': clearAll(); render(); break;
      case 'seed': seed(); break;
      case 'unseed': unseed(); break;
      case 'export': exportCsv(); break;
    }
  });
  function onSearch(ev) { S.q = ev.target.value; renderBand(); renderMain(); }
  $('#q').addEventListener('input', onSearch);
  $('#q').addEventListener('search', onSearch);
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'f-aula') { S.aula = t.value; render(); }
    else if (t.id === 'f-desde') { S.desde = t.value; render(); }
    else if (t.id === 'f-hasta') { S.hasta = t.value; render(); }
    else if (t.id === 'x-equipoId') { var e = S.equipos.find(function (x) { return x.id === t.value; }); $('#x-aula-hint').textContent = e ? 'Aula: ' + (e.aula || 'sin aula') : ''; }
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'x-proximo') { t.dataset.touched = '1'; return; }
    if (t.id === 'x-fecha' || t.id === 'x-tipo') {
      var p = $('#x-proximo'); if (!p || p.dataset.touched === '1') return;
      p.value = $('#x-tipo').value === 'Preventivo' ? addMonths($('#x-fecha').value, 6) : '';
    }
  });
  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (ev.target.id === 'form-eq') saveEq(ev.target);
    else if (ev.target.id === 'form-sv') saveSv(ev.target);
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && S.sheet) closeSheet(); });

        S[flag] = true; S.ready = S.rE && S.rS; render();
      }, function (err) { S.error = 'No se pudieron cargar los datos de la nube.'; S.ready = true; render(); });
