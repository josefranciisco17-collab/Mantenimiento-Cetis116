<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#0B131A;color:#E6EEF1}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mantenimiento de Aires Acondicionados · CETis 116 Antonia Nava de Catalán</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #0B131A;
  --surface: #131E26;
  --surface-2: #1B2934;
  --surface-3: #223442;
  --ink: #E6EEF1;
  --ink-2: #92A6B2;
  --line: #2A3F4E;
  --accent: #06B6D4;
  --accent-ink: #041E26;
  --accent-soft: rgba(6, 182, 212, 0.15);
  --ok: #10B981;
  --ok-soft: rgba(16, 185, 129, 0.15);
  --warn: #F59E0B;
  --warn-soft: rgba(245, 158, 11, 0.15);
  --bad: #EF4444;
  --bad-soft: rgba(239, 68, 68, 0.15);
  --scrim: rgba(5, 9, 13, 0.75);
  --font-display: 'Barlow Condensed', sans-serif;
  --font-body: 'Plus Jakarta Sans', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
body.lock { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.inner { max-width: 1100px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }

/* Masthead Corporativo */
.top { background: linear-gradient(180deg, #101B22 0%, var(--bg) 100%); border-bottom: 1px solid var(--line); padding-block: 28px 20px; }
.top .inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px; }
.brand h1 { font: 700 34px/1 var(--font-display); letter-spacing: .03em; text-transform: uppercase; color: #FFFFFF; }
.brand p { color: var(--ink-2); margin-top: 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
.top-actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* Botones Premium */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 8px 18px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); font-weight: 600; font-size: 14px; transition: all .2s; }
.btn:hover { border-color: var(--accent); background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { color: var(--bad); border-color: rgba(239, 68, 68, 0.3); background: transparent; }
.btn.danger:hover { background: var(--bad-soft); border-color: var(--bad); }
.btn.danger.solid { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.small { min-height: 34px; padding: 4px 12px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: default; }
.link { background: none; border: 0; padding: 4px 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; cursor: pointer; }

/* Search band */
.band { position: sticky; top: 0; z-index: 10; background: rgba(11, 19, 26, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.band .inner { display: flex; flex-direction: column; gap: 12px; padding-block: 14px; }
.search { position: relative; display: block; }
.search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; color: var(--ink-2); pointer-events: none; }
.search input { width: 100%; height: 52px; padding: 0 16px 0 50px; font-size: 16px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; color: var(--ink); }
.search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.tabs { display: flex; gap: 6px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; align-self: flex-start; }
.tabs button { min-height: 38px; padding: 6px 18px; border: 0; border-radius: 6px; background: transparent; font-weight: 600; color: var(--ink-2); text-transform: uppercase; font-size: 13px; letter-spacing: .05em; }
.tabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: 0 2px 8px rgba(6,182,212,.3); }
.tabs .n { font-family: var(--font-mono); font-size: 11px; margin-left: 6px; background: rgba(0,0,0,.2); padding: 2px 6px; border-radius: 4px; }

main { padding-block: 24px 36px; }
.banner { margin-bottom: 16px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; color: var(--ink-2); font-size: 14px; display: flex; align-items: center; justify-content: space-between; }
.banner.bad { background: var(--bad-soft); color: var(--bad); border-color: rgba(239,68,68,.3); }

/* Filters & Chips */
.filters { display: flex; flex-direction: column; gap: 14px; margin-bottom: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 36px; padding: 4px 14px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 13px; font-weight: 500; }
.chip b { font: 600 11px var(--font-mono); margin-left: 6px; background: rgba(255,255,255,.08); padding: 1px 6px; border-radius: 99px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.selects { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; }
.sel { display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .08em; }
.sel select, .sel input { min-height: 40px; padding: 6px 12px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 6px; font-size: 14px; color: var(--ink); }
.count { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; color: var(--ink-2); font-size: 14px; margin-bottom: 16px; font-family: var(--font-mono); }

/* Grupos y Tarjetas */
.grp { margin-bottom: 32px; }
.grp > h2 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 12px; }
.plate { display: inline-block; padding: 3px 12px; background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 6px; font: 700 18px var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: #fff; }
.plate.sm { font-size: 13px; padding: 1px 8px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 16px; }

/* Tarjeta de Equipo Estilo Empresarial */
.eq { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; transition: transform .2s, border-color .2s; box-shadow: 0 4px 20px rgba(0,0,0,.2); }
.eq:hover { border-color: rgba(6,182,212,.4); transform: translateY(-2px); }
.eq-open { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 18px; border: 0; background: none; text-align: left; border-radius: 10px 10px 0 0; }
.eq-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.eq-name { font: 700 22px/1.1 var(--font-display); letter-spacing: .02em; color: #fff; }
.eq-sub { color: var(--accent); font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }
.eq-meta { display: grid; gap: 4px; margin-top: 6px; font-size: 13px; font-family: var(--font-mono); }
.eq-meta .k { color: var(--ink-2); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin-right: 6px; }
.eq-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); background: rgba(0,0,0,.15); border-radius: 0 0 10px 10px; }
.mono { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }

/* Badges y Tags */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 99px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }

.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
.tag::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--ink-2); }
.tag.prev::before { background: var(--accent); }
.tag.corr::before { background: var(--warn); }
.tag.rep::before { background: var(--bad); }

/* Listado de Servicios */
.log { display: grid; gap: 10px; }
.sv { display: grid; grid-template-columns: 110px minmax(0, 1.8fr) minmax(0, 1fr) 100px; grid-template-areas: "date main meta cost"; gap: 8px 16px; align-items: center; width: 100%; padding: 14px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; text-align: left; }
.sv:hover { border-color: var(--accent); }
.sv-date { grid-area: date; font: 700 18px var(--font-display); letter-spacing: .03em; color: #fff; }
.sv-main { grid-area: main; display: flex; flex-direction: column; gap: 2px; }
.sv-eq { font-weight: 600; color: #fff; }
.sv-work { color: var(--ink-2); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sv-meta { grid-area: meta; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; font-size: 13px; }
.sv-cost { grid-area: cost; text-align: right; font-family: var(--font-mono); font-weight: 600; color: var(--accent); }

/* Sheet Lateral Estilo Panel Pro */
.overlay { position: fixed; inset: 0; z-index: 30; background: var(--scrim); backdrop-filter: blur(4px); display: flex; justify-content: flex-end; }
.sheet { width: min(620px, 100%); height: 100%; overflow-y: auto; background: var(--surface); border-left: 1px solid var(--line); padding: 24px; box-shadow: -12px 0 40px rgba(0,0,0,.6); }
.sheet-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.sheet-h h2 { font: 700 28px var(--font-display); text-transform: uppercase; color: #fff; }
.x { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); font-size: 20px; color: var(--ink); display: flex; align-items: center; justify-content: center; }
.det-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
.attrs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); gap: 12px; margin-bottom: 16px; padding: 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; font-family: var(--font-mono); font-size: 13px; }
.attrs dt { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
.attrs dd { margin: 0; color: #fff; }
.notes { margin-bottom: 16px; padding: 12px 16px; background: var(--bg); border-radius: 8px; color: var(--ink-2); font-size: 14px; border: 1px solid var(--line); white-space: pre-wrap; }
.acts { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px; margin-bottom: 16px; border: 1.5px solid var(--bad); border-radius: 8px; background: var(--bad-soft); color: #fff; }

.hist-t { font: 700 20px var(--font-display); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 12px; color: #fff; }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.hi { padding: 14px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; display: grid; gap: 8px; }
.hi-h { display: flex; align-items: center; gap: 12px; }
.hi-date { font: 700 18px var(--font-display); color: #fff; }

/* Formularios Pro */
.form { display: grid; gap: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 16px; }
.fld { display: flex; flex-direction: column; gap: 6px; }
.fld label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
.fld .req { color: var(--bad); }
.fld input, .fld select, .fld textarea { width: 100%; min-height: 46px; padding: 10px 14px; font-size: 15px; background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px; color: var(--ink); }
.fld textarea { min-height: 100px; resize: vertical; }
.fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.err { color: var(--bad); font-size: 12px; }
.hint { color: var(--ink-2); font-size: 12px; }
.form-acts { display: flex; gap: 10px; margin-top: 8px; }

.toast { position: fixed; z-index: 40; left: 50%; bottom: 24px; transform: translate(-50%, 20px); max-width: 90%; padding: 12px 20px; border-radius: 8px; background: #fff; color: #000; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: all .2s; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.empty { max-width: 500px; padding: 40px 0; display: flex; flex-direction: column; gap: 12px; }
.empty h2 { font: 700 28px var(--font-display); text-transform: uppercase; color: #fff; }
.empty p { color: var(--ink-2); }
</style>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <div class="inner">
    <div class="brand">
      <h1>Bitácora Climas</h1>
      <p>Gestión y Mantenimiento Corporativo</p>
    </div>
    <div class="top-actions">
      <button type="button" class="btn primary" data-action="new-eq">+ Equipo</button>
      <button type="button" class="btn" data-action="new-sv">+ Servicio</button>

<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var norm = function (s) { return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); };
  var natural = function (a, b) { return String(a).localeCompare(String(b), 'es', { numeric: true, sensitivity: 'base' }); };

  var TIPOS = ['Preventivo', 'Correctivo', 'Reparación', 'Instalación', 'Diagnóstico'];
  var TIPO_CLS = { 'Preventivo': 'prev', 'Correctivo': 'corr', 'Reparación': 'rep' };
  var TIPOS_EQ = ['Minisplit', 'Cassette', 'Piso-techo', 'Paquete', 'Ventana', 'Otro'];
  
  var MARCAS_FAMOSAS = ['Carrier', 'Mirage', 'LG', 'York', 'Trane', 'Midea', 'Daikin', 'Samsung', 'Panasonic', 'Mitsubishi', 'Hisense', 'Gree', 'Whirlpool', 'Electrolux', 'Fujitsu', 'TCL', 'Prime', 'Rheem', 'Aux', 'Chigo'];
  var MARCAS_OTRAS = ['Amana', 'Bryant', 'Daewoo', 'Fedders', 'Friedrich', 'GE', 'Haier', 'Kenmore', 'Kelvinator', 'Philco', 'Sanyo', 'Sharp', 'Toshiba', 'Westinghouse', 'Winia', 'Otra'];
  var REFRIG = ['R-410A', 'R-32', 'R-22', 'R-134a', 'R-290', 'R-407C'];

  /* ---------- fechas ---------- */
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var isoOf = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var parse = function (iso) { if (!iso) return null; var p = String(iso).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  var today = function () { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
  var todayIso = function () { return isoOf(today()); };
  var addDays = function (iso, n) { var d = parse(iso) || today(); d.setDate(d.getDate() + n); return isoOf(d); };
  var addMonths = function (iso, n) {
    var d = parse(iso); if (!d) return '';
    var day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n);
    var last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, last)); return isoOf(d);
  };
  var diffDays = function (a, b) { return Math.round((parse(a) - parse(b)) / 86400000); };
  var fmtF = function (iso) { var d = parse(iso); return d ? new Intl.DateTimeFormat('es-MX', { day: 'numeric', month: 'short', year: 'numeric' }).format(d).replace(/\./g, '') : ''; };
  var fmtL = function (iso) { var d = parse(iso); return d ? new Intl.DateTimeFormat('es-MX', { day: 'numeric', month: 'long', year: 'numeric' }).format(d) : ''; };
  var money = function (n) { return (n == null || n === '') ? '' : new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(n); };
  var uid = function (p) { return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };
  var plural = function (n, a, b) { return n + ' ' + (n === 1 ? a : b); };

  /* ---------- estado ---------- */
  var DB = null, currentUser = null;
  var S = { equipos: [], servicios: [], view: 'equipos', q: '', aula: '', estado: 'todos', tipo: 'todos', desde: '', hasta: '',
    ready: false, backend: '', error: '', sheet: null, confirm: null, busy: false, rE: false, rS: false };

  async function put(col, obj) {
    if (S.backend === 'db') {
      obj.actualizadoPor = currentUser ? currentUser.uid : 'desconocido';
      await DB.collection(col).doc(obj.id).set(obj);
      return;
    }
  }
  async function del(col, id) {
    if (S.backend === 'db') { await DB.collection(col).doc(id).delete(); return; }
  }
  function failMsg(err) {
    var c = err && err.code;
    if (c === 'permission-denied') return 'Tu cuenta no tiene permiso para guardar cambios.';
    return 'No se pudo guardar en la nube. Intenta de nuevo.';
  }

  var tt;
  function toast(msg) { var t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove('show'); }, 3400); }

  /* ---------- datos derivados y regla de 2 meses (60 días) para vencimiento ---------- */
  function svOf(eqId) { return S.servicios.filter(function (s) { return s.equipoId === eqId; }).sort(function (a, b) { return (b.fecha || '').localeCompare(a.fecha || ''); }); }
  function estadoEq(e) {
    var ss = svOf(e.id);
    if (!ss.length) return { k: 'nuevo', label: 'Sin servicios', last: null, next: null, rel: '' };
    var pend = ss.some(function (s) { return s.estado === 'Pendiente'; });
    var done = ss.filter(function (s) { return s.estado !== 'Pendiente'; });
    var last = done[0] || null;
    var wn = done.find(function (s) { return s.proximo; });
    var next = wn ? wn.proximo : null;
    var k = 'sinprox', label = 'Sin próxima fecha', rel = '';
    if (next) {
      var d = diffDays(next, todayIso());
      // Vencido si han pasado más de 60 días (2 meses) desde la fecha estimada
      if (d < -60) { k = 'vencido'; label = 'Servicio vencido'; rel = 'vencido hace ' + plural(-d, 'día', 'días'); }
      else if (d < 0) { k = 'vencido'; label = 'Servicio vencido'; rel = 'vencido hace ' + plural(-d, 'día', 'días'); }
      else if (d <= 30) { k = 'proximo'; label = 'Próximo servicio'; rel = d === 0 ? 'hoy' : 'en ' + plural(d, 'día', 'días'); }
      else { k = 'ok'; label = 'Al corriente'; rel = 'en ' + plural(d, 'día', 'días'); }
    }
    if (pend && k !== 'vencido') { k = 'pendiente'; label = 'Servicio pendiente'; }
    return { k: k, label: label, last: last, next: next, rel: rel };
  }
  var BADGE = { vencido: 'bad', proximo: 'warn', pendiente: 'warn', ok: 'ok', nuevo: '', sinprox: '' };
  var badge = function (st) { return '<span class="badge ' + (BADGE[st.k] || '') + '">' + esc(st.label) + '</span>'; };
  var tag = function (t) { return '<span class="tag ' + (TIPO_CLS[t] || '') + '">' + esc(t) + '</span>'; };

  function terms() { return norm(S.q).split(/\s+/).filter(Boolean); }
  function eqHay(e) { return norm([e.nombre, e.aula, e.edificio, e.marca, e.modelo, e.serie, e.tipo, e.capacidad, e.refrigerante, e.notas].join(' ')); }
  function svHay(s, e) { return norm([s.tipo, s.estado, s.trabajo, s.refacciones, s.tecnico, s.folio, s.aula, e ? e.nombre : '', e ? e.aula : '', fmtF(s.fecha), fmtL(s.fecha), s.fecha].join(' ')); }

  function eqList() {
    var T = terms(), out = [];
    S.equipos.forEach(function (e) {
      if (S.aula && norm(e.aula) !== norm(S.aula)) return;
      var ss = svOf(e.id), h = eqHay(e), via = [], ok = true;
      if (T.length) {
        var hs = ss.map(function (s) { return { s: s, h: svHay(s, e) }; });
        var all = h + ' ' + hs.map(function (x) { return x.h; }).join(' ');
        ok = T.every(function (t) { return all.indexOf(t) > -1; });
        if (ok && !T.every(function (t) { return h.indexOf(t) > -1; })) {
          via = hs.filter(function (x) { return T.some(function (t) { return x.h.indexOf(t) > -1; }); }).map(function (x) { return x.s; }).slice(0, 2);
        }
      }
      if (ok) out.push({ e: e, st: estadoEq(e), via: via });
    });
    return out;
  }
  function svList() {
    var T = terms(), byId = {};
    S.equipos.forEach(function (e) { byId[e.id] = e; });
    var out = [];
    S.servicios.forEach(function (s) {
      var e = byId[s.equipoId];
      if (S.aula && norm(s.aula) !== norm(S.aula) && !(e && norm(e.aula) === norm(S.aula))) return;
      if (S.tipo !== 'todos' && s.tipo !== S.tipo) return;
      if (S.desde && (s.fecha || '') < S.desde) return;
      if (S.hasta && (s.fecha || '') > S.hasta) return;
      if (T.length) { var h = svHay(s, e) + ' ' + (e ? eqHay(e) : ''); if (!T.every(function (t) { return h.indexOf(t) > -1; })) return; }
      out.push({ s: s, e: e });
    });
    out.sort(function (a, b) { return (b.s.fecha || '').localeCompare(a.s.fecha || ''); });
    return out;
  }
  function aulas() { return Array.from(new Set(S.equipos.map(function (e) { return (e.aula || '').trim(); }).filter(Boolean))).sort(natural); }

  /* ---------- render principal ---------- */
  function render() {
    var a = document.activeElement, id = a && a.id && a.id !== 'q' ? a.id : '';

  }
  function renderBand() {

  }

  }
  function emptyAll() {
    return '<div class="empty"><h2>No hay equipos registrados</h2>' +

      '<button type="button" class="btn" data-action="seed"' + (S.busy ? ' disabled' : '') + '>Cargar datos demo</button></div></div>';
  }
  function aulaSelect() {
    return '<label class="sel"><span>Aula / Zona</span><select id="f-aula"><option value="">Todas</option>' +
      aulas().map(function (a) { return '<option value="' + esc(a) + '"' + (norm(a) === norm(S.aula) ? ' selected' : '') + '>' + esc(a) + '</option>'; }).join('') + '</select></label>';
  }
  function chip(group, k, label, n) {
    var cur = group === 'estado' ? S.estado : S.tipo;
    return '<button type="button" class="chip" id="chip-' + group + '-' + k + '" data-action="chip-' + group + '" data-v="' + k + '" aria-pressed="' + (cur === k) + '">' + esc(label) + (n == null ? '' : '<b>' + n + '</b>') + '</button>';
  }
  function noResults() {

  }
  function exportBtn() { return '<button type="button" class="link" data-action="export">Exportar Reporte CSV</button>'; }

  function viewEquipos() {
    var list = eqList();
    var c = { todos: list.length, vencido: 0, proximo: 0, pendiente: 0, nuevo: 0 };
    list.forEach(function (it) { if (c[it.st.k] != null) c[it.st.k]++; });
    var shown = S.estado === 'todos' ? list : list.filter(function (it) { return it.st.k === S.estado; });
    var html = '<div class="filters"><div class="chips" role="group" aria-label="Filtrar por estado">' +
      chip('estado', 'todos', 'Todos', c.todos) + chip('estado', 'vencido', 'Vencidos (>2m)', c.vencido) + chip('estado', 'proximo', 'Próximos 30d', c.proximo) +
      chip('estado', 'pendiente', 'Pendientes', c.pendiente) + chip('estado', 'nuevo', 'Sin servicio', c.nuevo) + '</div>' +
      '<div class="selects">' + aulaSelect() + '</div></div>' +
      '<div class="count"><span>Mostrando ' + shown.length + ' de ' + plural(S.equipos.length, 'equipo', 'equipos') + '</span>' + exportBtn() + '</div>';
    if (!shown.length) return html + noResults();
    var groups = {};
    shown.forEach(function (it) { var k = norm(it.e.aula) || '~'; (groups[k] = groups[k] || { name: it.e.aula || 'Sin aula', items: [] }).items.push(it); });
    Object.keys(groups).sort(function (a, b) { return natural(groups[a].name, groups[b].name); }).forEach(function (k) {
      var g = groups[k];
      g.items.sort(function (a, b) { return natural(a.e.nombre, b.e.nombre); });
      var edif = g.items.map(function (it) { return it.e.edificio; }).find(Boolean);
      html += '<section class="grp"><h2><span class="plate">' + esc(g.name) + '</span><span style="font-size:13px;color:var(--ink-2);font-family:var(--font-mono);">' + (edif ? esc(edif) + ' · ' : '') + plural(g.items.length, 'equipo', 'equipos') + '</span></h2><div class="cards">' + g.items.map(eqCard).join('') + '</div></section>';
    });
    return html;
  }
  function eqCard(it) {
    var e = it.e, st = it.st;

      '<span class="eq-meta"><span><span class="k">Último</span>' + (st.last ? fmtF(st.last.fecha) + ' (' + esc(st.last.tipo) + ')' : 'sin registro') + '</span>' +
      '<span><span class="k">Próximo</span>' + (st.next ? fmtF(st.next) + ' (' + st.rel + ')' : 'sin fecha programada') + '</span></span>' +

      '<button type="button" class="btn small danger" data-action="quick-del-eq" data-id="' + esc(e.id) + '" title="Eliminar equipo">Eliminar</button></div></div></article>';
  }

  function viewServicios() {
    var list = svList();
    var total = list.reduce(function (a, x) { return a + (Number(x.s.costo) || 0); }, 0);
    var html = '<div class="filters"><div class="chips" role="group" aria-label="Filtrar por tipo">' + chip('tipo', 'todos', 'Todos') +
      TIPOS.map(function (t) { return chip('tipo', t, t); }).join('') + '</div>' +

  function renderFoot() {

  /* ---------- Sheet Lateral ---------- */
  function renderSheet(force) {

    var body = '', label = '';
    if (sh.type === 'eq') {
      var e = S.equipos.find(function (x) { return x.id === sh.id; });
      if (!e) { S.sheet = null; root.innerHTML = ''; document.body.classList.remove('lock'); return; }
      body = detailEq(e); label = e.nombre;
    } else if (sh.type === 'eq-form') { label = sh.id ? 'Editar equipo' : 'Registrar equipo'; body = formEq(sh.id ? S.equipos.find(function (x) { return x.id === sh.id; }) : null); }
    else if (sh.type === 'sv-form') { label = sh.id ? 'Editar servicio' : 'Nuevo servicio'; body = formSv(sh.id ? S.servicios.find(function (x) { return x.id === sh.id; }) : null, sh.eqId); }

    if (!force && scrollTop) $('.sheet', root).scrollTop = scrollTop;

  function openSheet(sh) { S.sheet = sh; S.confirm = null; renderSheet(true); var el = $('.sheet [data-first]') || $('.sheet .x'); if (el) el.focus(); }
  function closeSheet() { S.sheet = null; S.confirm = null; renderSheet(true); }

  function closeBtn() { return '<button type="button" class="x" data-action="close-sheet" aria-label="Cerrar">✕</button>'; }
  function detailEq(e) {

  function fld(label, name, val, o) {

  }

  function formSv(s, eqId) {
    var fecha = s ? s.fecha : todayIso();
    var tipo = s ? s.tipo : 'Preventivo';
    // Estimado predeterminado a 2 meses (2 meses exactos / 60 días) para mantenimiento preventivo
    var prox = s ? (s.proximo || '') : addMonths(fecha, 2);
    var cur = s ? s.equipoId : (eqId || '');
    var eqs = S.equipos.slice().sort(function (a, b) { return natural(a.aula, b.aula) || natural(a.nombre, b.nombre); });
    var opts = [['', 'Selecciona un equipo']].concat(eqs.map(function (e) { return [e.id, e.nombre + ' · ' + (e.aula || 'Sin aula')]; }));
    var tecs = Array.from(new Set(S.servicios.map(function (x) { return x.tecnico; }).filter(Boolean))).sort(natural);
    var eq0 = S.equipos.find(function (e) { return e.id === cur; });
    return '<div class="sheet-h"><h2>' + (s ? 'Editar servicio' : 'Nuevo servicio') + '</h2>' + closeBtn() + '</div>' +
      '<form class="form" id="form-sv" novalidate>' +
      sel('Equipo', 'equipoId', cur, opts, { req: 1 }) + '<p class="hint" id="x-aula-hint">' + (eq0 ? 'Aula: ' + esc(eq0.aula || 'sin aula') : '') + '</p>' +
      '<div class="grid2">' + fld('Fecha de intervención', 'fecha', fecha, { type: 'date', req: 1 }) + sel('Tipo de servicio', 'tipo', tipo, TIPOS, { req: 1 }) + '</div>' +
      '<div class="grid2">' + sel('Estado', 'estado', s ? (s.estado || 'Completado') : 'Completado', ['Completado', 'Pendiente']) + fld('Folio u orden', 'folio', s ? s.folio || '' : '') + '</div>' +
      fld('Trabajo realizado', 'trabajo', s ? s.trabajo || '' : '', { area: 1, ph: 'Limpieza de serpentines, presiones, lavado de filtros' }) +
      fld('Refacciones o materiales', 'refacciones', s ? s.refacciones || '' : '', { ph: 'Capacitor 35 µF, gas R-410A' }) +
      '<div class="grid2">' + fld('Técnico responsable', 'tecnico', s ? s.tecnico || '' : '', { list: 'dl-tec' }) + fld('Costo (MXN)', 'costo', s && s.costo != null ? s.costo : '', { type: 'number', step: '0.01', min: 0 }) + '</div>' +
      '<div class="fld"><label for="x-proximo">Próximo servicio (Estimado a 2 meses)</label><input id="x-proximo" name="proximo" type="date" value="' + esc(prox) + '" data-touched="' + (s ? 1 : 0) + '"><p class="hint">Calculado a 2 meses automáticamente para preventivos. Puedes ajustarlo.</p></div>' +
      dlist('dl-tec', tecs) +
      '<div class="form-acts"><button type="submit" class="btn primary">Guardar servicio</button><button type="button" class="btn" data-action="cancel-form">Cancelar</button></div></form>';
  }

  function showErrors(f, errs) {
    f.querySelectorAll('[data-err]').forEach(function (p) { p.hidden = true; var c = f.elements[p.dataset.err]; if (c) c.removeAttribute('aria-invalid'); });
    var first = null;
    Object.keys(errs).forEach(function (k) { var p = f.querySelector('[data-err="' + k + '"]'), c = f.elements[k]; if (p) { p.textContent = errs[k]; p.hidden = false; } if (c) { c.setAttribute('aria-invalid', 'true'); first = first || c; } });
    if (first) first.focus();
  }

  async function saveEq(f) {
    var fd = new FormData(f), v = function (k) { return String(fd.get(k) || '').trim(); }, errs = {};
    if (!v('nombre')) errs.nombre = 'Escribe el nombre del equipo.';
    if (!v('aula')) errs.aula = 'Indica en qué aula está.';
    if (!v('marca')) errs.marca = 'Selecciona una marca.';
    if (Object.keys(errs).length) return showErrors(f, errs);
    var old = S.sheet.id ? S.equipos.find(function (x) { return x.id === S.sheet.id; }) : null;
    var obj = { id: old ? old.id : uid('e'), nombre: v('nombre'), aula: v('aula'), edificio: v('edificio'), marca: v('marca'), modelo: v('modelo'), serie: v('serie'), tipo: v('tipo'), capacidad: v('capacidad'), refrigerante: v('refrigerante'), instalacion: v('instalacion'), notas: v('notas'), actualizado: new Date().toISOString() };
    var btn = f.querySelector('[type=submit]'); btn.disabled = true;
    try { await put('equipos', obj); toast('Equipo guardado correctamente'); openSheet({ type: 'eq', id: obj.id }); }
    catch (err) { btn.disabled = false; toast(failMsg(err)); }
  }

  async function saveSv(f) {
    var fd = new FormData(f), v = function (k) { return String(fd.get(k) || '').trim(); }, errs = {};
    if (!v('equipoId')) errs.equipoId = 'Selecciona el equipo.';
    if (!v('fecha')) errs.fecha = 'Indica la fecha.';
    if (Object.keys(errs).length) return showErrors(f, errs);
    var eq = S.equipos.find(function (x) { return x.id === v('equipoId'); });
    var old = S.sheet.id ? S.servicios.find(function (x) { return x.id === S.sheet.id; }) : null;
    var costo = v('costo'), n = costo === '' ? null : Number(costo);
    var obj = { id: old ? old.id : uid('s'), equipoId: v('equipoId'), aula: eq ? eq.aula : (old ? old.aula : ''), fecha: v('fecha'), tipo: v('tipo'), estado: v('estado') || 'Completado', trabajo: v('trabajo'), refacciones: v('refacciones'), tecnico: v('tecnico'), costo: (n == null || isNaN(n)) ? null : n, proximo: v('proximo'), folio: v('folio'), actualizado: new Date().toISOString() };
    var btn = f.querySelector('[type=submit]'); btn.disabled = true;
    try { await put('servicios', obj); toast('Servicio guardado correctamente'); openSheet({ type: 'eq', id: obj.equipoId }); }
    catch (err) { btn.disabled = false; toast(failMsg(err)); }
  }

  async function delEq(id) {
    S.busy = true; renderSheet(true);
    try {
      var ss = svOf(id); for (var i = 0; i < ss.length; i++) await del('servicios', ss[i].id);
      await del('equipos', id); S.busy = false; closeSheet(); toast('Equipo eliminado');
    } catch (err) { S.busy = false; renderSheet(true); toast(failMsg(err)); }
  }
  async function delSv(id) {
    S.busy = true; renderSheet(true);
    try { await del('servicios', id); S.busy = false; S.confirm = null; renderSheet(true); toast('Servicio eliminado'); }
    catch (err) { S.busy = false; renderSheet(true); toast(failMsg(err)); }
  }

  /* ---------- datos demo ---------- */
  async function seed() {
    if (S.busy) return; S.busy = true; render();
    var E = [
      ['Minisplit Aula 101', 'Aula 101', 'Edificio A', 'Carrier', '42QHC018', 'CR2201845', 'Minisplit', '18,000 BTU', 'R-410A', '2022-03-14'],
      ['Minisplit Aula 102', 'Aula 102', 'Edificio A', 'Mirage', 'Magnum 24', 'MG2307712', 'Minisplit', '24,000 BTU', 'R-410A', '2023-01-20'],
      ['Cassette Biblioteca', 'Biblioteca', 'Edificio B', 'LG', 'ATNQ48GPLA2', 'LG1904425', 'Cassette', '48,000 BTU', 'R-410A', '2019-08-05']
    ];
    var ids = E.map(function () { return uid('e'); });
    try {
      for (var i = 0; i < E.length; i++) {
        var x = E[i];
        await put('equipos', { id: ids[i], nombre: x[0], aula: x[1], edificio: x[2], marca: x[3], modelo: x[4], serie: x[5], tipo: x[6], capacidad: x[7], refrigerante: x[8], instalacion: x[9], notas: '', ejemplo: true, actualizado: new Date().toISOString() });
        await put('servicios', { id: uid('s'), equipoId: ids[i], aula: x[1], fecha: todayIso(), tipo: 'Preventivo', estado: 'Completado', trabajo: 'Limpieza general y revisión de presiones', refacciones: '', tecnico: 'Personal Técnico', costo: 650, proximo: addMonths(todayIso(), 2), folio: 'DEMO', ejemplo: true, actualizado: new Date().toISOString() });
      }
      toast('Datos demo cargados');
    } catch (err) { toast(failMsg(err)); }
    S.busy = false; render();
  }
  async function unseed() {
    if (S.busy) return; S.busy = true; render();
    try {
      var ss = S.servicios.filter(function (s) { return s.ejemplo; }), ee = S.equipos.filter(function (e) { return e.ejemplo; });
      for (var i = 0; i < ss.length; i++) await del('servicios', ss[i].id);
      for (var j = 0; j < ee.length; j++) {
        var rest = svOf(ee[j].id); for (var k = 0; k < rest.length; k++) await del('servicios', rest[k].id);
        await del('equipos', ee[j].id);
      }
      toast('Datos demo removidos');
    } catch (err) { toast(failMsg(err)); }
    S.busy = false; render();
  }

  /* ---------- exportar CSV ---------- */
  var csv = function (rows) { return rows.map(function (r) { return r.map(function (c) { c = c == null ? '' : String(c); return /[",\n\r]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\r\n'); };
  function exportCsv() {
    var rows, name;
    if (S.view === 'servicios') {
      rows = [['Fecha', 'Equipo', 'Aula', 'Edificio', 'Marca', 'Modelo', 'Serie', 'Tipo', 'Estado', 'Trabajo', 'Refacciones', 'Técnico', 'Costo', 'Próximo', 'Folio']];
      svList().forEach(function (x) { var s = x.s, e = x.e || {}; rows.push([s.fecha, e.nombre || '', s.aula || e.aula || '', e.edificio || '', e.marca || '', e.modelo || '', e.serie || '', s.tipo, s.estado, s.trabajo, s.refacciones, s.tecnico, s.costo, s.proximo, s.folio]); });
      name = 'servicios-' + todayIso() + '.csv';
    } else {
      rows = [['Equipo', 'Aula', 'Edificio', 'Marca', 'Modelo', 'Serie', 'Tipo', 'Capacidad', 'Refrigerante', 'Instalación', 'Estado', 'Último servicio', 'Próximo servicio']];
      eqList().filter(function (it) { return S.estado === 'todos' || it.st.k === S.estado; }).forEach(function (it) { var e = it.e; rows.push([e.nombre, e.aula, e.edificio, e.marca, e.modelo, e.serie, e.tipo, e.capacidad, e.refrigerante, e.instalacion, it.st.label, it.st.last ? it.st.last.fecha : '', it.st.next || '']); });
      name = 'equipos-' + todayIso() + '.csv';
    }
    var blob = new Blob(['﻿' + csv(rows)], { type: 'text/csv;charset=utf-8;' });
    var link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = name;
    link.style.display = 'none'; document.body.appendChild(link); link.click(); document.body.removeChild(link);
  }

  /* ---------- Eventos ---------- */
  function clearAll() { S.q = ''; S.aula = ''; S.estado = 'todos'; S.tipo = 'todos'; S.desde = ''; S.hasta = ''; $('#q').value = ''; }
  function openSvForm(eqId) {
    if (!S.equipos.length) { toast('Registra un equipo primero.'); openSheet({ type: 'eq-form' }); return; }
    openSheet({ type: 'sv-form', eqId: eqId || '' });
  }

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-action]'); if (!el) return;
    var a = el.dataset.action;
    if (a === 'overlay') { if (ev.target === el) closeSheet(); return; }
    switch (a) {
      case 'tab': S.view = el.dataset.v; render(); break;
      case 'new-eq': openSheet({ type: 'eq-form' }); break;
      case 'new-sv': openSvForm(el.dataset.eq); break;
      case 'open-eq': openSheet({ type: 'eq', id: el.dataset.id }); break;
      case 'edit-eq': openSheet({ type: 'eq-form', id: el.dataset.id }); break;
      case 'edit-sv': { var s = S.servicios.find(function (x) { return x.id === el.dataset.id; }); if (s) openSheet({ type: 'sv-form', id: s.id, eqId: s.equipoId }); break; }
      case 'close-sheet': closeSheet(); break;
      case 'cancel-form': { var sh = S.sheet, back = sh && (sh.type === 'sv-form' ? sh.eqId : sh.id); if (back && S.equipos.some(function (e) { return e.id === back; })) openSheet({ type: 'eq', id: back }); else closeSheet(); break; }
      case 'quick-del-eq': openSheet({ type: 'eq', id: el.dataset.id }); S.confirm = { kind: 'eq' }; renderSheet(true); break;
      case 'del-eq-ask': S.confirm = { kind: 'eq' }; renderSheet(true); break;
      case 'del-eq-yes': delEq(S.sheet.id); break;
      case 'del-sv-ask': S.confirm = { kind: 'sv', id: el.dataset.id }; renderSheet(true); break;
      case 'del-sv-yes': delSv(el.dataset.id); break;
      case 'cancel-confirm': S.confirm = null; renderSheet(true); break;
      case 'chip-estado': S.estado = el.dataset.v; render(); break;
      case 'chip-tipo': S.tipo = el.dataset.v; render(); break;
      case 'clear': clearAll(); render(); break;
      case 'seed': seed(); break;
      case 'unseed': unseed(); break;
      case 'export': exportCsv(); break;
      case 'logout': firebase.auth().signOut().then(function() { window.location.href = 'login.html'; }); break;
    }
  });

  function onSearch(ev) { S.q = ev.target.value; renderBand(); renderMain(); }
  $('#q').addEventListener('input', onSearch);
  $('#q').addEventListener('search', onSearch);

  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'f-aula') { S.aula = t.value; render(); }
    else if (t.id === 'f-desde') { S.desde = t.value; render(); }
    else if (t.id === 'f-hasta') { S.hasta = t.value; render(); }
    else if (t.id === 'x-equipoId') { var e = S.equipos.find(function (x) { return x.id === t.value; }); $('#x-aula-hint').textContent = e ? 'Aula: ' + (e.aula || 'sin aula') : ''; }
  });

  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'x-proximo') { t.dataset.touched = '1'; return; }
    if (t.id === 'x-fecha' || t.id === 'x-tipo') {
      var p = $('#x-proximo'); if (!p || p.dataset.touched === '1') return;
      // Cálculo automático predeterminado a 2 meses en servicios preventivos
      p.value = $('#x-tipo').value === 'Preventivo' ? addMonths($('#x-fecha').value, 2) : '';
    }
  });

  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (ev.target.id === 'form-eq') saveEq(ev.target);
    else if (ev.target.id === 'form-sv') saveSv(ev.target);
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && S.sheet) closeSheet(); });

      S.backend = 'db';

      var sub = function (col, flag) {
        DB.collection(col).onSnapshot(function (snap) {
          S[col] = snap.docs.map(function (d) { return Object.assign({}, d.data(), { id: d.id }); });
          S[flag] = true; S.ready = S.rE && S.rS; render();
        }, function (err) { S.error = 'No se pudieron sincronizar los datos de la nube.'; S.ready = true; render(); });

</script>
