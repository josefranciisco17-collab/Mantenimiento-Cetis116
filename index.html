<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Mantenimiento de Aires Acondicionados · Clima Hogar</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root { 
      --bg-gradient: linear-gradient(135deg, #0284c7 0%, #0369a1 50%, #0f172a 100%);
      --surface: rgba(15, 23, 42, 0.85);
      --surface-2: rgba(30, 41, 59, 0.7);
      --line: rgba(255, 255, 255, 0.12);
      --ink: #f8fafc;
      --ink-2: #94a3b8;
      --accent: #38bdf8;
      --accent-ink: #0f172a;
      --good: #10b981;
      --bad: #ef4444;
      --warning: #f59e0b;
    }
    body { 
      margin: 0; 
      background: var(--bg-gradient); 
      background-attachment: fixed;
      color: var(--ink); 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      padding: 16px; 
      box-sizing: border-box;
    }
    .container { max-width: 800px; margin: 0 auto; padding-bottom: 40px; }
    
    /* Cabecera Principal */
    .header-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .header-title { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; margin: 0 0 4px; color: #fff; text-transform: uppercase; letter-spacing: 0.5px; }
    .header-subtitle { font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 16px; }

    /* Botonera de Acciones */
    .actions-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .btn { 
      padding: 12px 14px; 
      border-radius: 12px; 
      font-weight: 700; 
      font-size: 12px; 
      text-transform: uppercase; 
      cursor: pointer; 
      border: 1px solid var(--line); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 6px; 
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn-secondary { background: var(--surface-2); color: var(--ink); }
    .btn-danger { background: rgba(239, 68, 68, 0.2); color: #f87171; border-color: rgba(239, 68, 68, 0.4); }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }

    /* Barra de Búsqueda */
    .search-box {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .search-box input {
      width: 100%;
      background: transparent;
      border: 0;
      color: #fff;
      font-size: 14px;
      outline: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .search-box input::placeholder { color: var(--ink-2); }

    /* Pestañas Principales (Equipos / Servicios) */
    .main-tabs { display: flex; gap: 10px; margin-bottom: 16px; }
    .main-tab { 
      flex: 1; 
      padding: 12px; 
      background: var(--surface-2); 
      border: 1px solid var(--line); 
      border-radius: 12px; 
      color: var(--ink-2); 
      font-weight: 700; 
      font-size: 13px; 
      text-transform: uppercase; 
      cursor: pointer; 
      text-align: center; 
    }
    .main-tab.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

    /* Tarjeta de Sesión e Info */
    .session-card {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 16px;
    }

    /* Filtros de Estado */
    .filter-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 20px; }
    .chip { 
      padding: 8px 14px; 
      background: var(--surface-2); 
      border: 1px solid var(--line); 
      border-radius: 20px; 
      color: var(--ink-2); 
      font-size: 12px; 
      font-weight: 600; 
      cursor: pointer; 
      white-space: nowrap; 
    }
    .chip.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

    /* Tarjetas de Contenido (Equipos / Servicios) */
    .card-item {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .card-title { font-size: 16px; font-weight: 700; color: #fff; }
    .badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .badge-good { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .badge-bad { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }

    .card-body { font-size: 13px; color: var(--ink-2); line-height: 1.5; margin-bottom: 14px; }
    .card-actions { display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; }

    .empty-state { text-align: center; padding: 40px; color: var(--ink-2); font-style: italic; }
  </style>
</head>
<body>

<div class="container">
  
  <!-- Cabecera y Menú de Acciones -->
  <div class="header-card">
    <div class="header-title">Mantenimiento de Aires Acondicionados</div>
    <div class="header-subtitle">CETis 116 - Antonia Nava de Catalán</div>

    <div class="actions-grid" id="admin-actions-container">
      <!-- Los botones de administrador y acciones se cargan dinámicamente -->
    </div>
  </div>

  <!-- Buscador -->
  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="input-buscar" placeholder="Buscar por equipo, aula, marca o serie..." oninput="filtrarDatos()">
  </div>

  <!-- Pestañas de Vista -->
  <div class="main-tabs">
    <button class="main-tab active" id="tab-equipos-btn" onclick="cambiarVistaTab('equipos')">📌 Equipos (<span id="count-equipos">0</span>)</button>
    <button class="main-tab" id="tab-servicios-btn" onclick="cambiarVistaTab('servicios')">📋 Servicios (<span id="count-servicios">0</span>)</button>
  </div>

  <!-- Sesión y Filtros -->
  <div class="session-card">
    <span>Sesión: <strong id="user-email-display" style="color:#fff;">Cargando...</strong></span>
    <span style="color: var(--good); font-weight: 600;">● Seguro</span>
  </div>

  <div class="filter-chips" id="filter-chips-container">
    <button class="chip active" onclick="filtrarEstado('todos')">Todos</button>
    <button class="chip" onclick="filtrarEstado('vencidos')">Vencidos (>2m)</button>
    <button class="chip" onclick="filtrarEstado('proximos')">Próximos 30d</button>
    <button class="chip" onclick="filtrarEstado('pendientes')">Pendientes</button>
  </div>

  <!-- Contenedor Principal de Registros -->
  <div id="content-list-container">
    <div class="empty-state">Cargando registros desde Firestore...</div>
  </div>

</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
  // Configuración de Firebase y lógica principal conectada a tu base de datos
  var firebaseConfig = {
    apiKey: "AIzaSyA_JufV6ZSCICVuUrVZEJropD1VKA2bzQs",
    authDomain: "mantenimientocetis116.firebaseapp.com",
    databaseURL: "https://mantenimientocetis116-default-rtdb.firebaseio.com",
    projectId: "mantenimientocetis116",
    storageBucket: "mantenimientocetis116.firebasestorage.app",
    messagingSenderId: "556796465966",
    appId: "1:556796465966:web:b0636bf4ee5ba99c21a0bf"
  };

  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();
  var adminEmail = 'josefranciisco17@gmail.com';

  var vistaActual = 'equipos';
  var filtroActual = 'todos';

  auth.onAuthStateChanged(function(user) {
    if (!user) {
      window.location.href = 'login.html';
      return;
    }
    document.getElementById('user-email-display').textContent = user.email;
    construirBotonera(user.email);
    cargarDatosGlobales();
  });

  function construirBotonera(email) {
    var container = document.getElementById('admin-actions-container');
    var html = '';
    if (email === adminEmail) {
      html += '<button class="btn btn-secondary" onclick="window.location.href=\'admin.html\'">⚙️ Aprobación</button>';
    }
    html += '<button class="btn btn-primary" onclick="alert(\'Abrir modal nuevo equipo\')">+ Equipo</button>';
    html += '<button class="btn btn-secondary" onclick="alert(\'Abrir modal nuevo servicio\')">+ Servicio</button>';
    html += '<button class="btn btn-secondary" onclick="alert(\'Generar Facturas\')">📄 Facturas</button>';
    html += '<button class="btn btn-secondary" onclick="alert(\'Generar Dictámenes\')">📋 Dictámenes</button>';
    html += '<button class="btn btn-danger" onclick="auth.signOut().then(() => window.location.href=\'login.html\')">🚪 Salir</button>';
    container.innerHTML = html;
  }

  function cambiarVistaTab(vista) {
    vistaActual = vista;
    document.getElementById('tab-equipos-btn').classList.toggle('active', vista === 'equipos');
    document.getElementById('tab-servicios-btn').classList.toggle('active', vista === 'servicios');
    cargarDatosGlobales();
  }

  function filtrarEstado(filtro) {
    filtroActual = filtro;
    var chips = document.querySelectorAll('.chip');
    chips.forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    cargarDatosGlobales();
  }

  async function cargarDatosGlobales() {
    var container = document.getElementById('content-list-container');
    container.innerHTML = '<div class="empty-state">Actualizando información...</div>';
    try {
      if (vistaActual === 'equipos') {
        var snap = await db.collection('equipos').get();
        document.getElementById('count-equipos').textContent = snap.size;
        if (snap.empty) {
          container.innerHTML = '<div class="empty-state">No hay equipos registrados en el sistema.</div>';
          return;
        }
        var html = '';
        snap.forEach(doc => {
          var eq = doc.data();
          html += '<div class="card-item">' +
                    '<div class="card-header">' +
                      '<div class="card-title">🏷️ ' + (eq.aula || 'Aula sin nombre') + '</div>' +
                      '<span class="badge badge-good">Operativo</span>' +
                    '</div>' +
                    '<div class="card-body">' +
                      '<b>Equipo:</b> ' + (eq.marca || 'Marca') + ' · ' + (eq.toneladas || '1.5') + ' Ton<br>' +
                      '<b>Serie:</b> ' + (eq.serie || 'N/D') +
                    '</div>' +
                  '</div>';
        });
        container.innerHTML = html;
      } else {
        var snap = await db.collection('servicios').get();
        document.getElementById('count-servicios').textContent = snap.size;
        if (snap.empty) {
          container.innerHTML = '<div class="empty-state">No hay servicios registrados en el historial.</div>';
          return;
        }
        var html = '';
        snap.forEach(doc => {
          var sv = doc.data();
          html += '<div class="card-item">' +
                    '<div class="card-header">' +
                      '<div class="card-title">📋 Servicio Técnico</div>' +
                      '<span class="badge badge-good">Completado</span>' +
                    '</div>' +
                    '<div class="card-body">' +
                      '<b>Descripción:</b> ' + (sv.descripcion || 'Mantenimiento preventivo') + '<br>' +
                      '<b>Fecha:</b> ' + (sv.fecha ? new Date(sv.fecha).toLocaleDateString() : 'N/D') +
                    '</div>' +
                  '</div>';
        });
        container.innerHTML = html;
      }
    } catch (err) {
      container.innerHTML = '<div class="empty-state" style="color:var(--bad);">Error al sincronizar con Firestore.</div>';
    }
  }

  function filtrarDatos() {
    // Función de filtrado local por texto de búsqueda
  }
</script>

</body>
</html>
