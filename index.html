<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Mantenimiento de Aires Acondicionados · Clima Hogar</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root { 
      --bg-gradient: linear-gradient(135deg, #0284c7 0%, #0369a1 50%, #0f172a 100%);
      --surface: rgba(15, 23, 42, 0.85);
      --surface-2: rgba(30, 41, 59, 0.7);
      --line: rgba(255, 255, 255, 0.12);
      --ink: #f8fafc;
      --ink-2: #94a3b8;
      --accent: #38bdf8;
      --accent-ink: #0f172a;
      --good: #10b981;
      --bad: #ef4444;
      --warning: #f59e0b;
    }
    body { 
      margin: 0; 
      background: var(--bg-gradient); 
      background-attachment: fixed;
      color: var(--ink); 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      padding: 16px; 
      box-sizing: border-box;
    }
    .container { max-width: 800px; margin: 0 auto; padding-bottom: 40px; }
    
    .header-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .header-title { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; margin: 0 0 4px; color: #fff; text-transform: uppercase; letter-spacing: 0.5px; }
    .header-subtitle { font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 16px; }

    .actions-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .btn { 
      padding: 12px 14px; 
      border-radius: 12px; 
      font-weight: 700; 
      font-size: 12px; 
      text-transform: uppercase; 
      cursor: pointer; 
      border: 1px solid var(--line); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 6px; 
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn-secondary { background: var(--surface-2); color: var(--ink); }
    .btn-danger { background: rgba(239, 68, 68, 0.2); color: #f87171; border-color: rgba(239, 68, 68, 0.4); }
    .btn-warning { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border-color: rgba(245, 158, 11, 0.4); }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }

    .search-box {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .search-box input {
      width: 100%;
      background: transparent;
      border: 0;
      color: #fff;
      font-size: 14px;
      outline: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .search-box input::placeholder { color: var(--ink-2); }

    .main-tabs { display: flex; gap: 10px; margin-bottom: 16px; }
    .main-tab { 
      flex: 1; 
      padding: 12px; 
      background: var(--surface-2); 
      border: 1px solid var(--line); 
      border-radius: 12px; 
      color: var(--ink-2); 
      font-weight: 700; 
      font-size: 13px; 
      text-transform: uppercase; 
      cursor: pointer; 
      text-align: center; 
    }
    .main-tab.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

    .session-card {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .filter-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 20px; }
    .chip { 
      padding: 8px 14px; 
      background: var(--surface-2); 
      border: 1px solid var(--line); 
      border-radius: 20px; 
      color: var(--ink-2); 
      font-size: 12px; 
      font-weight: 600; 
      cursor: pointer; 
      white-space: nowrap; 
    }
    .chip.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

    .card-item {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .card-title { font-size: 16px; font-weight: 700; color: #fff; }
    .badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .badge-good { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .badge-bad { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }

    .card-body { font-size: 13px; color: var(--ink-2); line-height: 1.6; margin-bottom: 12px; }
    .card-actions { display: flex; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; justify-content: flex-end; flex-wrap: wrap; }
    .empty-state { text-align: center; padding: 40px; color: var(--ink-2); font-style: italic; }

    /* Modales */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 16px; box-sizing: border-box; }
    .modal-card { background: #0f172a; border: 1px solid var(--line); border-radius: 16px; padding: 24px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
    .modal-card h2 { margin-top: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; color: #fff; text-transform: uppercase; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 11px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; background: rgba(30, 41, 59, 0.6); border: 1px solid var(--line); border-radius: 8px; color: #fff; font-size: 14px; box-sizing: border-box; }
    .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
  </style>
</head>
<body>

<div class="container">
  
  <div class="header-card">
    <div class="header-title">Mantenimiento de Aires Acondicionados</div>
    <div class="header-subtitle">CETis 116 - Antonia Nava de Catalán</div>

    <div class="actions-grid" id="admin-actions-container">
      <!-- Se carga dinámicamente -->
    </div>
  </div>

  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="input-buscar" placeholder="Buscar por equipo, aula, marca o serie..." oninput="renderizarDatos()">
  </div>

  <div class="main-tabs">
    <button class="main-tab active" id="tab-equipos-btn" onclick="cambiarTab('equipos')">📌 Equipos (<span id="count-equipos">0</span>)</button>
    <button class="main-tab" id="tab-servicios-btn" onclick="cambiarTab('servicios')">📋 Servicios (<span id="count-servicios">0</span>)</button>
  </div>

  <div class="session-card">
    <span>Sesión: <strong id="user-email-display" style="color:#fff;">Cargando...</strong></span>
    <span style="color: var(--good); font-weight: 600;">● Seguro</span>
  </div>

  <div class="filter-chips">
    <button class="chip active" onclick="filtrarEstado('todos', event)">Todos</button>
    <button class="chip" onclick="filtrarEstado('vencidos', event)">Vencidos (>2m)</button>
    <button class="chip" onclick="filtrarEstado('proximos', event)">Próximos 30d</button>
    <button class="chip" onclick="filtrarEstado('pendientes', event)">Pendientes</button>
  </div>

  <div id="content-list-container">
    <div class="empty-state">Sincronizando con Firestore...</div>
  </div>

</div>

<!-- MODAL PARA CREAR / EDITAR EQUIPO -->
<div class="modal-overlay" id="modal-equipo">
  <div class="modal-card">
    <h2 id="modal-equipo-titulo">Registrar Nuevo Equipo</h2>
    <form id="form-nuevo-equipo" onsubmit="guardarEquipo(event)">
      <input type="hidden" id="eq-id">
      <div class="form-group">
        <label>Aula o Zona</label>
        <input type="text" id="eq-aula" required placeholder="Ej. Laboratorio de Cómputo 1">
      </div>
      <div class="form-group">
        <label>Marca del Equipo</label>
        <select id="eq-marca" required>
          <option value="Carrier">Carrier</option>
          <option value="Mabe">Mabe</option>
          <option value="Mirage">Mirage</option>
          <option value="LG">LG</option>
          <option value="York">York</option>
          <option value="Trane">Trane</option>
          <option value="Midea">Midea</option>
          <option value="Daikin">Daikin</option>
          <option value="Samsung">Samsung</option>
          <option value="Otra">Otra</option>
        </select>
      </div>
      <div class="form-group">
        <label>Capacidad (Toneladas)</label>
        <input type="text" id="eq-toneladas" value="1.5" required>
      </div>
      <div class="form-group">
        <label>Número de Serie / Placa</label>
        <input type="text" id="eq-serie" placeholder="Ej. 449801416211200838">
      </div>
      <div class="form-group">
        <label>Último Servicio Realizado</label>
        <input type="date" id="eq-ultimo-servicio">
      </div>
      <div class="modal-buttons">
        <button type="submit" class="btn btn-primary" style="flex:1;">Guardar Equipo</button>
        <button type="button" class="btn btn-secondary" onclick="cerrarModales()" style="flex:1;">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<!-- MODAL PARA REGISTRAR SERVICIO -->
<div class="modal-overlay" id="modal-servicio">
  <div class="modal-card">
    <h2>Registrar Mantenimiento / Servicio</h2>
    <form id="form-nuevo-servicio" onsubmit="guardarServicio(event)">
      <div class="form-group">
        <label>Aula o Equipo Atendido</label>
        <input type="text" id="sv-aula" required placeholder="Ej. Aula 101">
      </div>
      <div class="form-group">
        <label>Tipo de Servicio / Descripción</label>
        <textarea id="sv-desc" rows="3" required placeholder="Mantenimiento preventivo, lavado de filtros, carga de gas..."></textarea>
      </div>
      <div class="form-group">
        <label>Fecha de Servicio</label>
        <input type="date" id="sv-fecha" required>
      </div>
      <div class="modal-buttons">
        <button type="submit" class="btn btn-primary" style="flex:1;">Registrar Servicio</button>
        <button type="button" class="btn btn-secondary" onclick="cerrarModales()" style="flex:1;">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
  var firebaseConfig = {
    apiKey: "AIzaSyA_JufV6ZSCICVuUrVZEJropD1VKA2bzQs",
    authDomain: "mantenimientocetis116.firebaseapp.com",
    databaseURL: "https://mantenimientocetis116-default-rtdb.firebaseio.com",
    projectId: "mantenimientocetis116",
    storageBucket: "mantenimientocetis116.firebasestorage.app",
    messagingSenderId: "556796465966",
    appId: "1:556796465966:web:b0636bf4ee5ba99c21a0bf"
  };

  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();
  var adminEmail = 'josefranciisco17@gmail.com';

  var tabActual = 'equipos';
  var filtroActual = 'todos';
  var listaEquiposGlobal = [];
  var listaServiciosGlobal = [];
  var permisosUsuario = { addService: true, editService: true, facturar: true, dictamen: true };

  auth.onAuthStateChanged(async function(user) {
    if (!user) {
      window.location.href = 'login.html';
      return;
    }
    document.getElementById('user-email-display').textContent = user.email;

    // Verificar si es admin o usuario regular para permisos
    if (user.email !== adminEmail) {
      try {
        var docUser = await db.collection('usuarios_registrados').doc(user.uid).get();
        if (docUser.exists && docUser.data().permisos) {
          permisosUsuario = docUser.data().permisos;
        }
      } catch(e) {}
    } else {
      permisosUsuario = { addService: true, editService: true, facturar: true, dictamen: true };
    }

    construirBotonera(user.email);
    cargarDatos();
  });

  function construirBotonera(email) {
    var container = document.getElementById('admin-actions-container');
    var html = '';
    if (email === adminEmail) {
      html += '<button class="btn btn-secondary" onclick="window.location.href=\'admin.html\'">⚙️ Aprobación</button>';
    }
    if (email === adminEmail || permisosUsuario.addService) {
      html += '<button class="btn btn-primary" onclick="abrirModalEquipo()">+ Equipo</button>';
      html += '<button class="btn btn-secondary" onclick="abrirModalServicio()">+ Servicio</button>';
    }
    html += '<button class="btn btn-secondary" onclick="window.location.href=\'facturas.html\'">📄 Facturas</button>';
    html += '<button class="btn btn-secondary" onclick="window.location.href=\'dictamenes.html\'">📋 Dictámenes</button>';
    html += '<button class="btn btn-danger" onclick="auth.signOut().then(() => window.location.href=\'login.html\')">🚪 Salir</button>';
    container.innerHTML = html;
  }

  function cambiarTab(tab) {
    tabActual = tab;
    document.getElementById('tab-equipos-btn').classList.toggle('active', tab === 'equipos');
    document.getElementById('tab-servicios-btn').classList.toggle('active', tab === 'servicios');
    renderizarDatos();
  }

  function filtrarEstado(filtro, e) {
    filtroActual = filtro;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    e.target.classList.add('active');
    renderizarDatos();
  }

  async function cargarDatos() {
    try {
      var eqSnap = await db.collection('equipos').get();
      listaEquiposGlobal = [];
      eqSnap.forEach(doc => { listaEquiposGlobal.push({ id: doc.id, ...doc.data() }); });
      document.getElementById('count-equipos').textContent = listaEquiposGlobal.length;

      var svSnap = await db.collection('servicios').get();
      listaServiciosGlobal = [];
      svSnap.forEach(doc => { listaServiciosGlobal.push({ id: doc.id, ...doc.data() }); });
      document.getElementById('count-servicios').textContent = listaServiciosGlobal.length;

      renderizarDatos();
    } catch (err) {
      document.getElementById('content-list-container').innerHTML = '<div class="empty-state" style="color:var(--bad);">Error al cargar datos de Firestore.</div>';
    }
  }

  function renderizarDatos() {
    var container = document.getElementById('content-list-container');
    var busqueda = document.getElementById('input-buscar').value.toLowerCase();
    var emailActual = auth.currentUser ? auth.currentUser.email : '';
    var esAdmin = (emailActual === adminEmail);

    if (tabActual === 'equipos') {
      var filtrados = listaEquiposGlobal.filter(eq => {
        var texto = ((eq.aula || '') + ' ' + (eq.marca || '') + ' ' + (eq.serie || '') + ' ' + (eq.toneladas || '')).toLowerCase();
        if (!texto.includes(busqueda)) return false;

        // Filtros de Vencimiento (>2m, etc.)
        if (filtroActual !== 'todos') {
          if (!eq.ultimoServicio) return filtroActual === 'pendientes';
          var fechaServ = new Date(eq.ultimoServicio);
          var hoy = new Date();
          var mesesDif = (hoy.getFullYear() - fechaServ.getFullYear()) * 12 + (hoy.getMonth() - fechaServ.getMonth());
          
          if (filtroActual === 'vencidos' && mesesDif < 2) return false;
          if (filtroActual === 'proximos' && (mesesDif < 1 || mesesDif > 2)) return false;
          if (filtroActual === 'pendientes' && mesesDif < 2) return false;
        }
        return true;
      });

      if (filtrados.length === 0) {
        container.innerHTML = '<div class="empty-state">No se encontraron equipos registrados.</div>';
        return;
      }

      var html = '';
      filtrados.forEach(eq => {
        var fechaServTxt = eq.ultimoServicio ? new Date(eq.ultimoServicio).toLocaleDateString() : 'Sin servicio registrado';
        var esVencido = false;
        if (eq.ultimoServicio) {
          var fS = new Date(eq.ultimoServicio);
          var hoy = new Date();
          var mD = (hoy.getFullYear() - fS.getFullYear()) * 12 + (hoy.getMonth() - fS.getMonth());
          if (mD >= 2) esVencido = true;
        }

        html += '<div class="card-item">' +
                  '<div class="card-header">' +
                    '<div class="card-title">🏷️ ' + esc(eq.aula || 'Aula sin nombre') + '</div>' +
                    '<span class="badge ' + (esVencido ? 'badge-bad' : 'badge-good') + '">' + (esVencido ? 'Vencido (>2m)' : 'Operativo') + '</span>' +
                  '</div>' +
                  '<div class="card-body">' +
                    '<b>Marca:</b> ' + esc(eq.marca || 'N/D') + ' · <b>Capacidad:</b> ' + esc(eq.toneladas || '1.5') + ' Ton<br>' +
                    '<b>Serie:</b> ' + esc(eq.serie || 'N/D') + '<br>' +
                    '<b>Último Servicio:</b> ' + fechaServTxt +
                  '</div>';
        
        if (esAdmin || permisosUsuario.editService) {
          html += '<div class="card-actions">' +
                    '<button class="btn btn-warning" style="padding: 6px 12px; font-size: 11px;" onclick="editarEquipo(\'' + eq.id + '\')">Editar</button>' +
                    '<button class="btn btn-danger" style="padding: 6px 12px; font-size: 11px;" onclick="eliminarEquipo(\'' + eq.id + '\')">Eliminar</button>' +
                  '</div>';
        }
        html += '</div>';
      });
      container.innerHTML = html;
    } else {
      var filtrados = listaServiciosGlobal.filter(sv => {
        var texto = ((sv.descripcion || '') + ' ' + (sv.aula || '') + ' ' + (sv.registradoPor || '')).toLowerCase();
        return texto.includes(busqueda);
      });

      if (filtrados.length === 0) {
        container.innerHTML = '<div class="empty-state">No hay servicios registrados en el historial.</div>';
        return;
      }

      var html = '';
      filtrados.forEach(sv => {
        html += '<div class="card-item">' +
                  '<div class="card-header">' +
                    '<div class="card-title">📋 ' + esc(sv.aula || 'Servicio Técnico') + '</div>' +
                    '<span class="badge badge-good">Completado</span>' +
                  '</div>' +
                  '<div class="card-body">' +
                    '<b>Descripción:</b> ' + esc(sv.descripcion || 'Mantenimiento preventivo') + '<br>' +
                    '<b>Fecha:</b> ' + (sv.fecha ? new Date(sv.fecha).toLocaleDateString() : 'N/D') + '<br>' +
                    '<b>Registrado por:</b> ' + esc(sv.registradoPor || 'N/D') +
                  '</div>' +
                '</div>';
      });
      container.innerHTML = html;
    }
  }

  function esc(str) {
    return str ? String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') : '';
  }

  window.abrirModalEquipo = function() {
    document.getElementById('modal-equipo-titulo').textContent = 'Registrar Nuevo Equipo';
    document.getElementById('eq-id').value = '';
    document.getElementById('eq-aula').value = '';
    document.getElementById('eq-marca').value = 'Carrier';
    document.getElementById('eq-toneladas').value = '1.5';
    document.getElementById('eq-serie').value = '';
    document.getElementById('eq-ultimo-servicio').value = '';
    document.getElementById('modal-equipo').style.display = 'flex';
  };

  window.editarEquipo = function(id) {
    var eq = listaEquiposGlobal.find(e => e.id === id);
    if (!eq) return;
    document.getElementById('modal-equipo-titulo').textContent = 'Editar Equipo';
    document.getElementById('eq-id').value = eq.id;
    document.getElementById('eq-aula').value = eq.aula || '';
    document.getElementById('eq-marca').value = eq.marca || 'Carrier';
    document.getElementById('eq-toneladas').value = eq.toneladas || '1.5';
    document.getElementById('eq-serie').value = eq.serie || '';
    document.getElementById('eq-ultimo-servicio').value = eq.ultimoServicio || '';
    document.getElementById('modal-equipo').style.display = 'flex';
  };

  window.abrirModalServicio = function() {
    document.getElementById('modal-servicio').style.display = 'flex';
    document.getElementById('sv-fecha').valueAsDate = new Date();
  };

  window.cerrarModales = function() {
    document.getElementById('modal-equipo').style.display = 'none';
    document.getElementById('modal-servicio').style.display = 'none';
  };

  window.guardarEquipo = async function(e) {
    e.preventDefault();
    var id = document.getElementById('eq-id').value;
    var aula = document.getElementById('eq-aula').value;
    var marca = document.getElementById('eq-marca').value;
    var toneladas = document.getElementById('eq-toneladas').value;
    var serie = document.getElementById('eq-serie').value;
    var ultimoServicio = document.getElementById('eq-ultimo-servicio').value;

    try {
      if (id) {
        await db.collection('equipos').doc(id).update({ aula, marca, toneladas, serie, ultimoServicio });
        alert('¡Equipo actualizado con éxito!');
      } else {
        await db.collection('equipos').add({ aula, marca, toneladas, serie, ultimoServicio, fechaCreacion: new Date().toISOString() });
        alert('¡Equipo registrado con éxito!');
      }
      cerrarModales();
      cargarDatos();
    } catch (err) {
      alert('Error al guardar equipo: ' + err.message);
    }
  };

  window.guardarServicio = async function(e) {
    e.preventDefault();
    var aula = document.getElementById('sv-aula').value;
    var descripcion = document.getElementById('sv-desc').value;
    var fecha = document.getElementById('sv-fecha').value;

    try {
      await db.collection('servicios').add({ aula, descripcion, fecha, registradoPor: auth.currentUser.email });
      cerrarModales();
      cargarDatos();
      alert('¡Servicio registrado con éxito!');
    } catch (err) {
      alert('Error al registrar servicio: ' + err.message);
    }
  };

  window.eliminarEquipo = async function(id) {
    if (confirm('¿Estás seguro de eliminar este equipo?')) {
      try {
        await db.collection('equipos').doc(id).delete();
        cargarDatos();
      } catch (err) {
        alert('Error al eliminar: ' + err.message);
      }
    }
  };
</script>
